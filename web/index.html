    return `<button class="ms-thumb${limit ? " limit" : ""}${t === c.sel && n > 1 ? " sel" : ""}" role="slider" data-t="${t}"
      aria-label="${c.label}: ${label}" aria-valuemin="${c.min}" aria-valuemax="${c.max}" aria-valuenow="${x}"
      style="left:${pos(c, x)}%">${glyph}</button>`;
  }).join("");
  const legend = isMulti(c) ? `<div class="legend" id="legend-${i}">${c.names.map((nm, t) =>
    `<button data-pick="${i}" data-t="${t}" aria-pressed="${t === c.sel}">${nm} <b>${vals(c)[t]}</b></button>`).join("")}</div>` : "";
  return head() + `<div class="ms" id="ms-${i}" data-ms="${i}"><div class="ms-track"></div>
      ${isMulti(c) ? '<div class="ms-zone"></div>' : ""}<div class="ms-fill"></div>${thumbs}</div>
    ${legend}
    <div class="ctl-foot"><span class="hint">${c.keys.join(" · ")}</span>
      <button class="step" data-nudge="${i}" data-d="-1" aria-label="${c.label} down">−</button>
      <button class="step" data-nudge="${i}" data-d="1" aria-label="${c.label} up">+</button>${reset}</div>`;
}

// Keeps the thumbs in order: a range's low stays at or below its high; a
// servo's limits stay outside Closed and Open, which may be either way round;
// a holo axis's limits stay outside its centre.
function clampThumb(c, t, x, cur) {
  let lo = c.min, hi = c.max;
  if (c.type === "range") { if (t === 0) hi = cur[1]; else lo = cur[0]; }
  if (c.type === "servo") {
    if (t === 0) hi = Math.min(cur[1], cur[2]);
    else if (t === 3) lo = Math.max(cur[1], cur[2]);

    const w = c.width; let h, dir = 1, pass;
    if (c.bounce) { const span = n > 1 ? n - 1 : 1; pass = Math.floor(dist / span); const f = dist - pass * span;
      if (pass % 2 === 0) h = f; else { h = span - f; dir = -1; } }
    else { const travel = n + w; pass = Math.floor(dist / travel); h = dist - pass * travel; }
    for (let j = 0; j < n; j++) { const behind = (h - j) * dir; if (behind < 0 || behind >= w) continue;
      const f = 1 - behind / w; out[at(j)] = sc(colour(pass), f * f); }
  } else if (c.fx === "scroll") {
    const unit = k * c.width;
    for (let j = 0; j < n; j++) { let x = (j - dist) % unit; if (x < 0) x += unit; out[at(j)] = colour(Math.floor(x / c.width)); }
  } else if (c.fx === "pulse") {
    const phase = ms / (6000 / (c.speed + 1)), breath = Math.floor(phase), v = (1 - Math.cos(2 * Math.PI * (phase - breath))) / 2;
    out.fill(sc(colour(breath), v));
  } else if (c.fx === "sparkle") {
    const slotMs = Math.floor(1000 / (c.speed + 2)), slot = Math.floor(ms / slotMs), within = 1 - (ms % slotMs) / slotMs;
    for (let j = 0; j < n; j++) { const h = Math.imul(j + 1, 2654435761) ^ Math.imul(slot + 7, 40503); if (((h >>> 0) % 6) === 0) out[j] = sc(colour((h >>> 8)), within); }
  }
  if (c.bright < 100) for (let i = 0; i < n; i++) out[i] = sc(out[i], c.bright / 100);
  return out;
}

// Live previews: a row of dots for each open Lights item, looping the effect
// (with its fade-in) for its run time, or 6 s.
let pxRaf = 0, pxStart = performance.now();
const pxRestart = () => { pxStart = performance.now(); };
function pxTick() {
  pxRaf = 0;
  const els = document.querySelectorAll(".pxprev"), lgs = document.querySelectorAll(".lgprev");
  if ((!els.length && !lgs.length) || !draft) return;
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  els.forEach((el) => {
    const s = draft.anim.steps[+el.dataset.i];
    const c = s && s.ui;
    if (!c) return;
    const loop = ((c.run || 6) + (c.fade || 0)) * 1000;
    const ms = still ? 1500 : (performance.now() - pxStart) % loop;
    const n = el.children.length;
    let frame = c.fx === "off" ? new Array(n).fill(0) : renderPixelsJs(c, ms, n);
    if (c.fade && ms < c.fade * 1000 && c.fx !== "off") {
      const f = ms / (c.fade * 1000);
      frame = frame.map((v) => ((Math.round(((v >> 16) & 255) * f) << 16) | (Math.round(((v >> 8) & 255) * f) << 8) | Math.round((v & 255) * f)));
    }
    frame.forEach((v, i) => {
      const dot = el.children[i];
      dot.style.background = v ? `#${v.toString(16).padStart(6, "0")}` : "";
      dot.style.boxShadow = v ? `0 0 6px #${v.toString(16).padStart(6, "0")}` : "";
    });
  });
  lgs.forEach((el) => lgDraw(el, performance.now() - pxStart, still));
  if (!still) pxRaf = requestAnimationFrame(pxTick);
}
function pxKick() { if (!pxRaf) pxRaf = requestAnimationFrame(pxTick); }

function lightsFields(s, i) {
  const c = s.ui;
  if (!c) return `<p class="fhint wide">The builder can't show this command, so it's kept as typed below.
    <button type="button" class="link" data-preset>Start over with the builder</button></p>` + rawFld(s, i).replace("<details", "<details open");
  const n = Math.max(1, Math.min(64, droid.settings.px_count || 28));
  const dots = `<div class="pxprev wide" data-i="${i}" aria-hidden="true">${"<span></span>".repeat(n)}</div>`;
  const cols = pxUses(c.fx, "colours") ? `<div class="fld wide"><span>Colours${c.colours.length > 1 ? " (in order)" : ""}</span><div class="pxcols">
      ${c.colours.map((h, k) => `<span class="pxcol"><input type="color" id="f-${i}-pcol-${k}" data-f="pcol" data-k="${k}" value="${h}" aria-label="Colour ${k + 1}">
        ${c.colours.length > 1 ? `<button type="button" class="sdel" data-pdel="${k}" aria-label="Remove colour ${k + 1}">${svg("close")}</button>` : ""}</span>`).join("")}
      ${c.colours.length < 4 ? `<button type="button" class="btn secondary pxadd" data-padd>+ Colour</button>` : ""}</div></div>` : "";
  return dots + fld("Effect", sel("pfx", i, PX_EFFECTS, c.fx)) + cols
    + (pxUses(c.fx, "dir") ? fld("Direction", sel("pdir", i, [[1, "Left to right"], [-1, "Right to left"]], c.dir)) : "")
    + (pxUses(c.fx, "speed") ? fld("Speed (0–9)", num("psp", i, c.speed, 0, 9)) : "")
    + (pxUses(c.fx, "width") ? fld(c.fx === "swoop" ? "Tail length (pixels)" : "Band width (pixels)", num("pw", i, c.width, 1, 20)) : "")
    + (pxUses(c.fx, "bounce") ? `<label class="fld chk"><input type="checkbox" id="f-${i}-pbounce" data-f="pbounce" ${c.bounce ? "checked" : ""}><span>Back and forth</span></label>` : "")
    + fld(c.fx === "off" ? "Fade out over (s)" : "Fade in over (s)", num("pfade", i, c.fade, 0, 60, 0.1))
    + (c.fx !== "off" ? fld("Run for (s, 0 = keep)", num("prun", i, c.run, 0, 3600, 0.5)) : "")
    + (c.fx !== "off" ? fld("Brightness (%)", num("pb", i, c.bright, 0, 100, 5)) : "")
    + `<p class="fhint wide">${c.run ? "After its run time it fades back to whatever the lights showed before." : "Stays on until the next Lights item."} Overall brightness and strip length are in Settings › Body lights.</p>`
    + rawFld(s, i);
}

function lightsSetField(s, f, value, el) {
  const c = s.ui;
  if (f === "pfx") {
    c.fx = value;
    if (pxUses(value, "colours") && !c.colours.length) c.colours = ["#4cb8cf"];
    s.text = pixelText(c);
    return "item";
  }
  if (f === "pcol") c.colours[+el.dataset.k] = value.toLowerCase();
  else if (f === "pdir") c.dir = +value;
  else if (f === "psp") c.speed = clampInt(value, 0, 9);
  else if (f === "pw") c.width = clampInt(value, 1, 20);
  else if (f === "pbounce") c.bounce = el.checked;
  else if (f === "pfade") c.fade = Math.max(0, Math.min(60, Math.round(Number(value) * 10) / 10 || 0));
  else if (f === "prun") c.run = Math.max(0, Math.min(3600, Math.round(Number(value) * 10) / 10 || 0));
  else if (f === "pb") c.bright = clampInt(value, 0, 100);
  s.text = pixelText(c);
  pxRestart();
  return "";
}

let tapAgain = null;  // a delete or reset waiting for its second tap
function armTap(key, el, text) {
  if (tapAgain === key) { tapAgain = null; return true; }
  tapAgain = key;
  const old = el.innerHTML;
  el.textContent = text;
  announce(text);
  setTimeout(() => { if (tapAgain === key) { tapAgain = null; el.innerHTML = old; } }, 3000);
  return false;
}
const blockTimes = (steps) => [...new Set(steps.map((s) => s.atMs))].sort((x, y) => x - y);

// --- the editor -------------------------------------------------------------
// draft: { key, anim, dirty, empty }; empty holds the start times of blocks
// that have nothing in them yet (on the droid a block is only its steps).
let draft = null;
let openItem = null;   // the step whose controls are showing
let addOpen = null;    // the block whose + Add choices are showing
const withUi = (s) => ({ ...s, ui: s.kind === K.Holo ? parseHoloMulti(s.text) : s.kind === K.Logic ? parseLogic(s.text)
  : s.kind === K.Pixels ? parsePixels(s.text) : null });
function openDraft(key) {
  if (draft && draft.key === key) return draft;
  let anim;
  if (key === "anim-new") anim = { id: 0, name: "New animation", icon: "neutral", steps: [] };
  else {
    const a = animList.find((x) => "anim-" + x.id === key);
    if (!a) return null;
    anim = { id: a.id, name: a.name, icon: a.icon || "", steps: a.steps.map(withUi) };
  }
  draft = { key, anim, dirty: key === "anim-new", empty: anim.steps.length ? [] : [0] };
  openItem = null;
  addOpen = anim.steps.length ? null : 0;   // a new animation starts ready to add

}
const draftBlocks = () => [...new Set([...draft.anim.steps.map((s) => s.atMs), ...draft.empty])].sort((x, y) => x - y);

function newStep(kind, at) {
  if (kind === "sound") return { atMs: at, kind: K.Sound, a: 0, b: 0, text: "" };
  if (kind === "emotion") return { atMs: at, kind: K.Emotion, a: 0, b: 0, text: "" };
  if (kind === "servo") return { atMs: at, kind: K.ServoSequence, a: Math.max(0, seqNames.indexOf("Wave")), b: 0, text: "" };
  if (kind === "holo") return { atMs: at, kind: K.Holo, a: 0, b: 0, text: "", ui: emptyHolo() };
  if (kind === "lights") return withUi({ atMs: at, kind: K.Pixels, a: 0, b: 0, text: "swoop #4cb8cf s6 w5" });
  if (kind === "dome") { const s = { atMs: at, kind: K.Dome, a: 0, b: 0, text: "" }; setDome(s, DOME.GoTo, -30, 0); return s; }
  if (kind === "logic") return withUi({ atMs: at, kind: K.Logic, a: 0, b: 0, text: "~RTLE990505" });

}

const sel = (f, i, opts, cur, attrs = "") => `<select id="f-${i}-${f}" data-f="${f}" ${attrs}>${opts.map(([v, n]) =>

const num = (f, i, v, min, max, step = 1, attrs = "") => `<input type="number" inputmode="decimal" id="f-${i}-${f}" data-f="${f}" value="${v}" min="${min}" max="${max}" step="${step}" ${attrs}>`;
const rawFld = (s, i) => `<details class="adv wide"${s.ui === null && s.kind === K.Holo ? " open" : ""}><summary>Command sent</summary>
  <input class="raw" id="f-${i}-raw" data-f="raw" value="${esc(s.text)}" maxlength="${LIM.text}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Command sent"></details>`;

// The sound item: the chosen sounds as chips; the full list only while

function soundPicker(s, i) {

function holoRows(s, i) {

    `<option value="${f[0]}"${cur && cur.fx === f[0] ? " selected" : ""}>${f[1]}</option>`).join("")}`;

function stepFields(s, i) {
  if (isSound(s)) return soundPicker(s, i);
  if (s.kind === K.Emotion) return fld("Feeling", sel("emo", i, EMO_NAMES.map((n, k) => [k, n]), s.a));
  if (s.kind === K.Dome) {
    const act = domeAct(s), v = domeVal(s), x = domeExtra(s);
    const what = fld("Move", sel("dact", i, [[DOME.Home, "Look ahead (home)"], [DOME.GoTo, "Face an angle"], [DOME.Spin, "Spin"], [DOME.Stop, "Stop turning"]], act));
    const side = fld("Direction", sel("dside", i, [[-1, "Left"], [1, "Right"]], v < 0 ? -1 : 1));
    if (act === DOME.GoTo) {
      return what + side + fld("Degrees from ahead", num("ddeg", i, Math.abs(v), 0, 180))
        + fld("Speed (%)", num("dspd", i, x || UI_DOME_SPEED, 10, 100, 5))
        + `<p class="fhint wide">Angles are from straight ahead, not from where the dome is now. After power-up the Roam-a-Dome ignores turns until the dome has been turned once with the stick.</p>`;
    }
    if (act === DOME.Spin) {
      return what + side + fld("Speed (%)", num("dspd", i, Math.abs(v), 10, 100, 5))
        + fld("For (s)", num("dsecs", i, (x / 10).toFixed(1), 0.1, 25.5, 0.1))
        + `<p class="fhint wide">Spin only works while CH5 is in manual mode, and moving the stick takes over.</p>`;
    }
    return what;
  }
  if (s.kind === K.ServoSequence) {
    return fld("Sequence", sel("seq", i, seqOrder().map((n) => [seqNames.indexOf(n), `${esc(n)} · ${seqLengths[n]} s`]), s.a), "wide");
  }
  if (s.kind === K.Pixels) return lightsFields(s, i);
  if (s.kind === K.Holo) {

      <button type="button" class="link" data-hreset>Start over with the builder</button></p>` + rawFld(s, i);
    return holoRows(s, i) + rawFld(s, i);
  }
  if (s.kind === K.Logic) return logicFields(s, i);
  return "";
}

// The timeline: blocks along the top, then a row per kind of step, time
// running left to right. Drag a block (or anything in it) to move it.
let tlSpan = 4000;
let tlDrag = null, tlDragged = false;
const LANE_NAMES = { [K.Sound]: "Sound", [K.Emotion]: "Emotion", [K.ServoSequence]: "Servos", [K.Dome]: "Dome", [K.Holo]: "Holos", [K.Logic]: "Logics", [K.Pixels]: "Lights" };
function renderTimeline() {
  const a = draft.anim, blocks = draftBlocks();
  const ends = [...a.steps.map((s) => s.atMs + stepLengthMs(s)), ...blocks];
  const span = Math.max(4000, Math.max(0, ...ends) * 1.25 + 1000);
  tlSpan = span;
  // Fewer labels on a phone, where the track is under 300px wide.
  const most = matchMedia("(max-width: 600px)").matches ? 4 : 8;
  const tick = [1, 2, 5, 10, 15, 30].find((t) => span / (t * 1000) <= most) || 60;
  const ticks = [];
  for (let t = 0; t * 1000 <= span; t += tick) ticks.push(`<span class="tick" style="left:${(t * 1000 / span) * 100}%">${t} s</span>`);
  const grid = `style="--tick:${(tick * 1000 / span) * 100}%"`;
  const pos = (ms) => (ms / span) * 100;
  const chips = blocks.map((at, n) => `<button class="bchip" id="bchip-${n}" data-drag="${at}" data-jumpb="${at}" style="left:${pos(at)}%"
    data-t="${(at / 1000).toFixed(1)} s" aria-label="Block ${n + 1} at ${(at / 1000).toFixed(1)} s">${n + 1}</button>`).join("");
  const lanes = [[K.Sound, K.RandomSound, K.SoundPick], [K.Emotion], [K.ServoSequence], [K.Dome], [K.Holo], [K.Logic], [K.Pixels]].filter((ks) => a.steps.some((s) => ks.includes(s.kind)));
  const laneHtml = lanes.map((ks) => {
    const [, icon, hue] = KIND[ks[0]];
    const marks = a.steps.filter((s) => ks.includes(s.kind)).map((s) => {
      const w = pos(stepLengthMs(s));
      return `<span class="mark hue-${hue}${w > 1 ? " long" : ""}" data-drag="${s.atMs}" style="left:${pos(s.atMs)}%;${w > 1 ? `width:${w}%` : ""}" title="${esc(stepSummary(s))}"></span>`;
    }).join("");
    return `<div class="lane"><span class="lname hue-${hue}">${svg(icon)}<span>${LANE_NAMES[ks[0]]}</span></span><div class="ltrack" ${grid}>${marks}</div></div>`;
  }).join("");
  return `<div class="tlhead"><h2 class="tlh">Timeline</h2><span class="fhint">Drag a numbered block to retime it (or use the arrow keys); tap it to go to it.</span></div>
    <div class="ticks">${ticks.join("")}</div>
    <div class="lane"><span class="lname blocks">Blocks</span><div class="ltrack btrack" ${grid}>${chips}</div></div>${laneHtml}`;
}

function animLength(a) { return Math.max(0, ...a.steps.map((s) => s.atMs + stepLengthMs(s))) / 1000; }

function renderEditor() {
  const d = draft, a = d.anim, full = a.steps.length >= LIM.steps;
  const icons = `<select id="ed-icon" data-e="icon" aria-label="Icon">${ANIM_ICONS.map((n) => `<option value="${n}"${n === a.icon ? " selected" : ""}>${iconName(n)}</option>`).join("")}</select>`;
  // Each block: its number and start time on the left, one line per item.
  // A line opens into its controls (one at a time); + Add offers the kinds.
  const blocks = draftBlocks().map((at, n) => {
    const idx = a.steps.map((s, i) => i).filter((i) => a.steps[i].atMs === at)
      .sort((x, y) => KIND_ORDER[a.steps[x].kind] - KIND_ORDER[a.steps[y].kind] || x - y);
    const has = (test) => idx.some((i) => test(a.steps[i]));
    const items = idx.map((i) => {
      const s = a.steps[i], [name, icon, hue] = KIND[s.kind];
      if (openItem !== s) {
        return `<button type="button" class="iline hue-${hue}" data-open="${i}" id="step-${i}" aria-expanded="false">
          <span class="sico">${svg(icon)}</span><span class="iname">${name}</span><span class="isum">${esc(stepSummary(s))}</span>
          <span class="ichev">${svg("chev")}</span></button>`;
      }
      return `<div class="bitem hue-${hue}" data-i="${i}" id="step-${i}" role="group" aria-labelledby="ititle-${i}">
        <div class="ihead"><span class="sico">${svg(icon)}</span><div class="stitle"><h4 class="ititle" id="ititle-${i}" tabindex="-1">${name}</h4><small id="sum-${i}">${esc(stepSummary(s))}</small></div>
          <button type="button" class="link danger-t" data-del="${i}">Remove</button>
          <button type="button" class="btn sdone" data-close aria-expanded="true">Done</button></div>
        <div class="sbody" id="sbody-${i}">${stepFields(s, i)}</div></div>`;
    }).join("");
    let firstId = `addfirst-${n}`;   // focus lands on the first choice that's free
    const kind = (k, label, icon, hue, taken) => {
      const off = full || taken, id = off ? "" : firstId;
      if (!off) firstId = "";
      return `<button type="button" class="addk hue-${hue}" data-badd="${k}" ${id ? `id="${id}"` : ""} ${off ? "disabled" : ""}><span class="sico">${svg(icon)}</span>${label}</button>`;
    };
    const adds = addOpen === at
      ? `<div class="addrow">${kind("sound", "Sound", "files", "gold", has(isSound))}${kind("emotion", "Emotion", "emotion", "happy", has((s) => s.kind === K.Emotion))}${kind("servo", "Servo sequence", "pie", "teal", has((s) => s.kind === K.ServoSequence))}${kind("dome", "Dome", "dome", "orange", has((s) => s.kind === K.Dome))}<button type="button" class="addk hue-orange" data-shake ${a.steps.length + 3 > LIM.steps || has((s) => s.kind === K.Dome) ? "disabled" : ""}><span class="sico">${svg("dome")}</span>Head shake</button>${kind("holo", "Holoprojectors", "holo", "sky", has((s) => s.kind === K.Holo))}${kind("logic", "Logic displays", "logic", "violet", false)}${kind("lights", "Lights", "lights", "pink", has((s) => s.kind === K.Pixels))}<button type="button" class="link" data-addmenu id="addcancel-${n}">Cancel</button></div>`
      : `<div class="bfoot"><button type="button" class="link addlink" data-addmenu id="addlink-${n}" ${full ? "disabled" : ""}>+ Add to block ${n + 1}</button>
         <button type="button" class="link danger-t" data-bdel>Delete block</button></div>`;
    return `<section class="block" data-at="${at}" id="blk-${n}" aria-labelledby="bh-${n}">
      <h3 class="sr-only" id="bh-${n}" tabindex="-1">Block ${n + 1}, starts at ${(at / 1000).toFixed(1)} seconds</h3>
      <div class="bgut"><span class="bnum">${n + 1}</span>
        <label class="btime"><input type="number" inputmode="decimal" id="b-${n}-at" data-b="at" value="${(at / 1000).toFixed(1)}" min="0" max="${LIM.ms / 1000}" step="0.1" aria-label="Block ${n + 1} starts at, seconds"><span>s</span></label></div>
      <div class="bmain">${items || '<p class="fhint">Nothing yet.</p>'}${adds}</div></section>`;
  // (blocks are h3 for screen readers; items inside them are h4 when open)
  }).join("");
  return `<div class="ed">
    <div class="edtop">
      <span class="edimg"><img src="emoji/${esc(a.icon || "neutral")}.svg" alt="" width="56" height="56" id="ed-img"></span>
      <label class="fld"><span>Name</span><input id="ed-name" data-e="name" value="${esc(a.name)}" maxlength="${LIM.name}" autocomplete="off"></label>
      <label class="fld"><span>Icon</span>${icons}</label>
      <div class="edstat"><b id="ed-len">${animLength(a).toFixed(1)} s</b><small>${a.steps.length} of ${LIM.steps} items</small>
        <small id="dirty" aria-live="polite" class="${d.dirty ? "warn-t" : "ok-t"}">${d.dirty ? "Unsaved changes" : "Saved"}</small></div>
    </div>
    <div class="tl" id="tl">${renderTimeline()}</div>
    <h2 class="sr-only">Blocks</h2>
    <div class="blocks">${blocks}</div>
    <button type="button" class="btn secondary addblock" id="ed-addblock" ${full ? "disabled" : ""}>+ Add block</button>
    ${full ? `<p class="fhint">An animation holds ${LIM.steps} items in all.</p>` : ""}
    ${d.error ? `<div class="errbox" role="alert" id="ed-error" tabindex="-1"><b>Can't save yet.</b><span>${esc(d.error.msg)}</span>
      <button type="button" class="link" data-showerr>Show me</button></div>` : ""}
    <div class="actions foot">
      <button class="btn" id="ed-save">${a.id ? "Save" : "Save new animation"}</button>
      ${a.id ? `<button class="btn secondary" id="ed-play" ${d.dirty ? 'disabled title="Save first"' : ""}>Play</button>` : ""}
      ${d.dirty && a.id ? `<button class="btn secondary" id="ed-discard">Discard changes</button>` : ""}
      ${a.id ? `<button class="btn secondary danger" id="ed-delete">Delete animation</button>` : ""}
    </div></div>`;
}

// Updates what a change affects, without redrawing the field in use.
function editorRefresh(i) {
  const a = draft.anim;
  draft.dirty = true;
  if (draft.error) { draft.error = null; const eb = document.getElementById("ed-error"); if (eb) eb.remove(); }
  const d = document.getElementById("dirty");
  if (d) { d.textContent = "Unsaved changes"; d.className = "warn-t"; }
  const tl = document.getElementById("tl");
  if (tl) tl.innerHTML = renderTimeline();
  const len = document.getElementById("ed-len");
  if (len) len.textContent = `${animLength(a).toFixed(1)} s`;
  const p = document.getElementById("ed-play");
  if (p) p.disabled = true;
  if (i == null) return;
  const s = a.steps[i];
  const sum = document.getElementById(`sum-${i}`);
  if (sum) sum.textContent = stepSummary(s);
  const raw = document.getElementById(`f-${i}-raw`);
  if (raw && document.activeElement !== raw) raw.value = s.text;
  const lp = document.getElementById(`lprev-${i}`);
  if (lp && s.ui && s.ui.mode === "text") lp.innerHTML = fontShow(s.ui.text) || "&nbsp;";
  const sc = document.getElementById(`scount-${i}`);
  if (sc) { const n = soundFiles(s).length; sc.textContent = n ? `${n} picked` : "None picked"; }
}
// Redraws one item's fields (its shape changed), keeping focus if we can.
function redrawItem(i, focusId) {
  const body = document.getElementById("sbody-" + i);
  if (body) body.innerHTML = stepFields(draft.anim.steps[i], i);
  pxRestart();
  pxKick();
  const back = focusId && document.getElementById(focusId);
  if (back) back.focus({ preventScroll: true });
}

const clampInt = (v, lo, hi) => { const x = Math.round(Number(v)); return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : lo; };
// Applies one field. Returns "item" when the item's fields change shape,
// "all" when the whole editor needs redrawing.
function setField(i, f, value, typing, el) {
  const s = draft.anim.steps[i];
  if (f === "emo") { s.a = +value; return ""; }
  if (s.kind === K.Dome) {
    const act = domeAct(s), v = domeVal(s), x = domeExtra(s), sign = v < 0 ? -1 : 1;
    if (f === "dact") {
      const a2 = +value;
      if (a2 === DOME.GoTo) setDome(s, a2, -30, 0);
      else if (a2 === DOME.Spin) setDome(s, a2, 50, 30);
      else setDome(s, a2, 0, 0);
      return "item";
    }
    if (f === "dside") setDome(s, act, Math.abs(v) * +value || (act === DOME.Spin ? 50 * +value : 0), x);
    else if (f === "ddeg") setDome(s, act, sign * clampInt(value, 0, 180), x);
    else if (f === "dspd" && act === DOME.GoTo) setDome(s, act, v, clampInt(value, 10, 100));
    else if (f === "dspd") setDome(s, act, sign * clampInt(value, 10, 100), x);
    else if (f === "dsecs") setDome(s, act, v, clampInt(Number(value) * 10, 1, 255));
    return "";
  }
  if (f === "seq") { s.a = +value; return ""; }
  if (f === "raw") {
    s.text = value;
    if (typing) return "";
    if (s.kind === K.Holo || s.kind === K.Logic || s.kind === K.Pixels) s.ui = withUi(s).ui;
    return "item";
  }
  if (s.kind === K.Pixels && s.ui) return lightsSetField(s, f, value, el);
  if (s.kind === K.Holo) {
    const k = el && el.dataset.k != null ? +el.dataset.k : -1, h = s.ui;
    let shape = "";
    if (f === "hwhole") h.whole = value;
    else if (f === "hl" || f === "hm") {
      const type = f[1], prev = h.rows[k][type];
      if (!value) h.rows[k][type] = null;
      else {
        const fx = holoFx(value);
        h.rows[k][type] = { fx: value, c: fx[3] === "p" ? 1 : prev && holoFx(prev.fx)[3] === fx[3] ? prev.c : 0, secs: prev ? prev.secs : 0 };
      }
      shape = "item";
    }
    else if (f === "hlc" || f === "hmc") h.rows[k][f[1]].c = +value;
    else if (f === "hls" || f === "hms") h.rows[k][f[1]].secs = clampInt(value, 0, 3600);
    s.text = holoMultiText(h);
    return shape;
  }
  if (s.kind === K.Logic) {
    const l = s.ui;
    if (f === "lmode") {
      if (value === "effect") s.ui = l.mode === "effect" ? l : { mode: "effect", targets: [...ALL_TARGETS], fx: 99, c: 0, sp: 5, secs: 5 };
      else if (value === "text") {
        s.ui = { mode: "text", addr: 0, text: l.mode === "text" ? l.text : "R2-AU" };
        s.text = logicText(s.ui);
        // Text needs a scroll effect to show: add one to this block if there's room.
        const steps = draft.anim.steps;
        const scrolls = steps.some((x) => x !== s && x.atMs === s.atMs && x.kind === K.Logic && x.ui && x.ui.mode === "effect" && x.ui.fx >= 15 && x.ui.fx <= 18);
        if (!scrolls && steps.length < LIM.steps) {
          steps.splice(i + 1, 0, withUi({ atMs: s.atMs, kind: K.Logic, a: 0, b: 0, text: "~RTLE1160510;~RTLE3160510" }));  // scroll left on both logics
          return "all";
        }
      }
      else s.ui = { mode: "custom" };
      if (value !== "custom") s.text = logicText(s.ui);
      return "item";
    }
    if (f === "lfx") l.fx = +value;
    else if (f === "lc") l.c = +value;
    else if (f === "lsp") l.sp = clampInt(value, 0, 9);
    else if (f === "lsecs") l.secs = clampInt(value, 0, 99);
    else if (f === "laddr") l.addr = +value;
    else if (f === "ltext") l.text = fontOnly(value).slice(0, LIM.text - 2);
    s.text = logicText(l);
    return "";
  }
  return "";
}

// Returns null, or what's wrong: { msg, step (to open), focus (an id) }.
function validateDraft(a) {
  const bad = (msg, extra = {}) => ({ msg, ...extra });
  if (!a.name.trim()) return bad("Give the animation a name.", { focus: "ed-name" });
  if (bytes(a.name.trim()) > LIM.name) return bad(`Names are up to ${LIM.name} characters.`, { focus: "ed-name" });
  if (!a.steps.length) return bad("Add something to a block first.", { focus: "addlink-0" });
  const blocks = blockTimes(a.steps);
  for (const s of a.steps) {
    const where = `${KIND[s.kind][0]} in block ${blocks.indexOf(s.atMs) + 1}`;
    const at = { step: s };
    if (isSound(s) && !soundFiles(s).length) return bad(`${where}: pick a sound, or remove it.`, at);
    if (s.kind === K.Holo && !holoTokens(s.text).length) return bad(`${where}: pick an effect for a holoprojector, or remove it to leave them alone.`, at);
    if (s.kind === K.Logic && !s.text.trim()) return bad(`${where}: type a command.`, at);
    if (bytes(s.text) > LIM.text) return bad(`${where}: the command is too long (${LIM.text} characters at most).`, at);
    if (s.kind === K.Holo && !holoValid(s.text)) return bad(`${where}: the dome won't understand the command.`, at);
    if (s.kind === K.Pixels && !parsePixels(s.text)) return bad(`${where}: the body C3 can't read the lights command.`, at);
  }
  return null;
}

function saveDraft() {
  const a = draft.anim;
  const problem = validateDraft(a);
  draft.error = problem;
  if (problem) {
    // Open the item with the problem; the message stays until the next save.
    if (problem.step) { openItem = problem.step; addOpen = null; }
    pendingFocus = "ed-error";
    render();
    return;
  }
  // Time order; within a block, the order shown (text before its scroll).
  const order = a.steps.map((s, i) => i).sort((x, y) => a.steps[x].atMs - a.steps[y].atMs
    || KIND_ORDER[a.steps[x].kind] - KIND_ORDER[a.steps[y].kind] || x - y);
  const clean = { id: a.id, name: a.name.trim(), icon: a.icon, steps: order.map((i) => { const { ui, ...s } = a.steps[i]; return s; }) };
  const isNew = !a.id;
  if (live.ws) live.sendAnimation(clean);   // id 0: the droid gives it the next free id
  else {
    if (isNew) clean.id = Math.max(199, ...animList.map((x) => x.id)) + 1;
    const at = animList.findIndex((x) => x.id === clean.id);
    if (at >= 0) animList[at] = clean; else animList.push(clean);
    toast("Saved in the preview");
  }
  if (isNew) { draft = null; location.hash = "set-animations"; return; }
  draft = { key: "anim-" + clean.id, anim: { ...clean, steps: clean.steps.map(withUi) }, dirty: false, empty: [] };
  render();
}

// Moves a block (every item in it) to a new time.
function moveBlock(from, to) {
  draft.anim.steps.forEach((s) => { if (s.atMs === from) s.atMs = to; });
  draft.empty = draft.empty.map((t) => (t === from ? to : t));
}

// Clicks in the animation list and editor. True if handled.
function editorClick(e) {
  const t = e.target;
  if (t.closest("#anim-reset")) {
    const b = t.closest("#anim-reset");
    if (!armTap("reset", b, "Tap again: this replaces every animation")) return true;
    draft = null;
    if (live.ws) live.send(new W().u8(UI.ResetAnimations));
    else { animList = defaultAnimList(); render(); toast("Reset in the preview"); }
    return true;
  }
  if (!draft || !location.hash.startsWith("#anim-")) return false;
  const a = draft.anim;
  const jb = t.closest("[data-jumpb]");
  if (jb && tlDragged) { tlDragged = false; return true; }
  if (jb) {
    const blk = document.querySelector(`.block[data-at="${jb.dataset.jumpb}"]`);
    if (blk) { blk.scrollIntoView({ behavior: motion(), block: "start" }); blk.classList.add("flash"); setTimeout(() => blk.classList.remove("flash"), 900); }
    return true;
  }
  const blk = t.closest(".block");
  const at = blk ? +blk.dataset.at : 0;
  const openB = t.closest("[data-open]");
  if (openB) {
    openItem = a.steps[+openB.dataset.open];
    addOpen = null;
    pendingFocus = `ititle-${openB.dataset.open}`;
    render();
    const el = document.getElementById("step-" + openB.dataset.open);
    if (el) el.scrollIntoView({ block: "nearest" });
    return true;
  }
  if (t.closest("[data-close]")) {
    const was = a.steps.indexOf(openItem);
    openItem = null;
    if (was >= 0) soundOpen.delete(a.steps[was]);
    pendingFocus = `step-${was}`;
    render();
    const el = document.getElementById("step-" + was);
    if (el) el.scrollIntoView({ block: "nearest" });
    return true;
  }
  if (t.closest("[data-addmenu]")) {
    addOpen = addOpen === at ? null : at;
    const n = draftBlocks().indexOf(at);
    pendingFocus = addOpen === null ? `addlink-${n}` : `addfirst-${n}`;
    render();
    return true;
  }
  // Head shake: face left, then right, then ahead, as dome moves in this
  // block and the next two (each can be changed like any other).
  const shake = t.closest("[data-shake]");
  if (shake && !shake.disabled) {
    const deg = 30, gap = 1000, speed = 60;
    const moves = [[at, DOME.GoTo, -deg], [at + gap, DOME.GoTo, deg], [at + 2 * gap, DOME.Home, 0]];
    const made = moves.map(([when, act, v]) => {
      const st = { atMs: Math.min(LIM.ms, when), kind: K.Dome, a: 0, b: 0, text: "" };
      setDome(st, act, v, act === DOME.GoTo ? speed : 0);
      return st;
    });
    a.steps.push(...made);
    draft.empty = draft.empty.filter((x) => x !== at);
    draft.dirty = true;
    openItem = made[0];
    addOpen = null;
    pendingFocus = `ititle-${a.steps.indexOf(made[0])}`;
    render();
    announce(`Head shake added: ${deg} degrees left, then right a second later, then ahead`);
    return true;
  }
  const addB = t.closest("[data-badd]");
  if (addB && !addB.disabled) {
    const made = newStep(addB.dataset.badd, at);
    if (addB.dataset.badd === "sound") soundOpen.add(made);
    a.steps.push(made);
    openItem = made;
    addOpen = null;
    pendingFocus = `ititle-${a.steps.length - 1}`;
    draft.empty = draft.empty.filter((x) => x !== at);
    draft.dirty = true;
    render();
    const card = document.getElementById("step-" + (a.steps.length - 1));
    if (card) card.scrollIntoView({ behavior: motion(), block: "nearest" });
    return true;
  }
  const bdel = t.closest("[data-bdel]");
  if (bdel) {
    const inside = a.steps.filter((s) => s.atMs === at).length;
    if (inside && !armTap("bdel" + at, bdel, "Tap again")) return true;
    const n = draftBlocks().indexOf(at);
    draft.anim.steps = a.steps.filter((s) => s.atMs !== at);
    draft.empty = draft.empty.filter((x) => x !== at);
    draft.dirty = true;
    const left = draftBlocks().length;
    pendingFocus = left ? `bh-${Math.min(n, left - 1)}` : "ed-addblock";
    announce(`Block ${n + 1} deleted`);
    render();
    return true;
  }
  if (t.closest("#ed-addblock")) {
    const times = draftBlocks();
    const next = times.length ? Math.min(LIM.ms, Math.ceil((times[times.length - 1] + 2000) / 100) * 100) : 0;
    if (!times.includes(next)) draft.empty.push(next);
    addOpen = next;           // ready to add to it
    openItem = null;
    pendingFocus = `addfirst-${draftBlocks().indexOf(next)}`;
    draft.dirty = true;
    render();
    const last = document.getElementById("blk-" + (draftBlocks().length - 1));
    if (last) last.scrollIntoView({ behavior: motion(), block: "nearest" });
    return true;
  }
  const del = t.closest("[data-del]");
  if (del) {
    const s = a.steps[+del.dataset.del];
    a.steps.splice(+del.dataset.del, 1);
    if (!a.steps.some((x) => x.atMs === s.atMs)) draft.empty.push(s.atMs);   // the block stays, empty
    draft.dirty = true;
    pendingFocus = `addlink-${draftBlocks().indexOf(s.atMs)}`;
    announce(`${KIND[s.kind][0]} removed`);
    render();
    return true;
  }
  const item = t.closest("[data-i]");
  const i = item ? +item.dataset.i : -1, s = i >= 0 ? a.steps[i] : null;
  if (t.closest("[data-sopen]") && s) {
    soundOpen.add(s); redrawItem(i, `f-${i}-ssearch`);
    return true;
  }
  if (t.closest("[data-sdone]") && s) {
    soundOpen.delete(s); redrawItem(i, `sopen-${i}`);
    return true;
  }
  const unpick = t.closest("[data-unpick]");
  if (unpick && s) {
    setSoundFiles(s, soundFiles(s).filter((f) => f !== +unpick.dataset.unpick));
    redrawItem(i, `sopen-${i}`); editorRefresh(i);
    announce(`${soundName(+unpick.dataset.unpick)} removed`);
    return true;
  }
  const file = t.closest("[data-file]");
  if (file && s) {
    const f = +file.dataset.file, on = new Set(soundFiles(s));
    if (on.has(f)) on.delete(f); else on.add(f);
    setSoundFiles(s, [...on]);
    file.setAttribute("aria-pressed", String(on.has(f)));
    editorRefresh(i);
    return true;
  }
  const sall = t.closest("[data-sall]");
  if (sall && s) {
    const list = SOUND_GROUPS.find(([g]) => g === sall.dataset.sall)[1].map(([f]) => f);
    const on = new Set(soundFiles(s)), all = list.every((f) => on.has(f));
    list.forEach((f) => (all ? on.delete(f) : on.add(f)));
    setSoundFiles(s, [...on]);
    redrawItem(i, sall.id);
    editorRefresh(i);
    return true;
  }
  if (s && s.kind === K.Pixels && s.ui) {
    if (t.closest("[data-padd]")) { s.ui.colours.push(s.ui.colours[s.ui.colours.length - 1] || "#ffffff"); s.text = pixelText(s.ui); redrawItem(i, `f-${i}-pcol-${s.ui.colours.length - 1}`); editorRefresh(i); return true; }
    const pdel = t.closest("[data-pdel]");
    if (pdel) { s.ui.colours.splice(+pdel.dataset.pdel, 1); s.text = pixelText(s.ui); redrawItem(i, `f-${i}-pcol-0`); editorRefresh(i); return true; }
  }
  if (t.closest("[data-preset]") && s) { s.ui = parsePixels("solid #4cb8cf"); s.text = pixelText(s.ui); redrawItem(i, `f-${i}-pfx`); editorRefresh(i); return true; }
  if (t.closest("[data-hreset]") && s) { s.ui = emptyHolo(); s.text = ""; redrawItem(i, `f-${i}-hwhole`); editorRefresh(i); return true; }
  if (s && s.kind === K.Logic && s.ui && logicClick(t, s, i)) return true;
  if (t.closest("#ed-save")) { saveDraft(); return true; }
  if (t.closest("#ed-discard")) { const k = draft.key; draft = null; openDraft(k); render(); return true; }
  if (t.closest("#ed-play")) {
    if (live.ws) live.send(new W().u8(UI.RunAnimation).u16(a.id));
    toast(droid.connected ? `Playing ${a.name}` : `Playing ${a.name} (preview)`);
    return true;
  }
  const delA = t.closest("#ed-delete");
  if (delA) {
    if (!armTap("delete", delA, "Tap again to delete")) return true;
    const id = a.id;
    draft = null;
    if (live.ws) live.send(new W().u8(UI.DeleteAnimation).u16(id));

// Backup and restore, done on the page with the messages the S3 already

  if (d.version !== 1) throw new Error(`This backup is format ${d.version}; this page reads format 1.`);

      || q.frames.some((f) => !int(f.ms) || !Array.isArray(f.pos) || f.pos.length !== SEQ_SERVOS.length

// Versions as Version.h compares them: numbers, then a release beats its
// pre-release ("0.2.0-dev" < "0.2.0").
function compareVersions(a, b) {
  const parse = (v) => { const m = /^(\d+)\.(\d+)\.(\d+)(-.*)?$/.exec(v || "") || []; return [+m[1] || 0, +m[2] || 0, +m[3] || 0, m[4] || ""]; };
  const x = parse(a), y = parse(b);
  for (let k = 0; k < 3; k++) if (x[k] !== y[k]) return x[k] < y[k] ? -1 : 1;
  if (x[3] === y[3]) return 0;
  if (!x[3] || !y[3]) return x[3] ? -1 : 1;
  return x[3] < y[3] ? -1 : 1;
}

// Firmware updates over Wi-Fi (OtaServer.cpp). Reads the file's R2AU-FW
// tag, uploads it, then follows OtaStatus and NodeVersion.
const OTA_STATES = ["", "Uploading", "Joining the S3's Wi-Fi", "Downloading", "Restarting", "Failed"];

      ? { file, tag, name, phase: "confirm", percent: 0, message: "" }
      : { file, phase: "failed", message: "That isn't an R2-AU firmware file (no board tag inside it)." };

    return `<div class="item node${odd ? " odd" : ""}"><div><b>${n}</b><small>${n === "body-s3" ? "Updates itself; carries this page" : "Joins the S3's Wi-Fi to update"}</small>

    return id;
  }
  const s = screens[id];
  if (!s || (s.wifiOnly && droid.client === "display") || lockReason(id)) return "menu";
  return id;
}

let pendingFocus = null;   // an element id to focus after the next render
function render() {
  const id = current();
  const s = screens[id];
  document.getElementById("title").textContent = s.title;
  document.getElementById("back").hidden = id === "menu";
  document.getElementById("back-label").textContent = s.parent ? screens[s.parent].title : "Menu";
  document.getElementById("back").setAttribute("aria-label", "Back to " + (s.parent ? screens[s.parent].title : "menu"));
  document.getElementById("chips").innerHTML = renderChips();
  const view = document.getElementById("view");
  if (view.dataset.screen !== id) { view.scrollTop = 0; window.scrollTo(0, 0); }
  const newScreen = view.dataset.screen !== undefined && view.dataset.screen !== id;
  const focused = document.activeElement, fid = focused && view.contains(focused) ? focused.id : "";
  let caret = null;
  try { caret = fid && focused.selectionStart != null ? [focused.selectionStart, focused.selectionEnd] : null; } catch (err) {}
  view.dataset.screen = id;
  view.innerHTML = s.render();
  // Focus: where an action asked for it, else the heading of a new screen,
  // else back where it was (redraws keep element ids).
  const want = pendingFocus && document.getElementById(pendingFocus);
  pendingFocus = null;
  const back = fid && document.getElementById(fid);
  if (want) want.focus({ preventScroll: true });
  else if (newScreen) document.getElementById("title").focus({ preventScroll: true });
  else if (back) { back.focus({ preventScroll: true }); try { if (caret) back.setSelectionRange(...caret); } catch (err) {} }
  if (id.startsWith("set-")) (openGroup.controls || []).forEach((c, i) => paint(i));
  else openGroup = null;
  pxKick();  // light previews in an open Lights item
  document.getElementById("preview").hidden = droid.connected;
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go && !go.disabled) { location.hash = go.dataset.go; return; }
  if (editorClick(e)) return;
  if (wifiClick(e)) return;
  if (fwClick(e)) return;
  if (sqClick(e)) return;
  if (bkClick(e)) return;
  if (settingClick(e)) return;
  const tab = e.target.closest("[data-tab]");
  if (tab) { controlTab = tab.dataset.tab; try { localStorage.setItem("r2au-control-tab", controlTab); } catch (err) {} render(); return; }
  const act = e.target.closest("[data-act]");
  if (act) { sendAction(actions[+act.dataset.act], act); return; }
  if (e.target.closest("#back")) { location.hash = screens[current()].parent || ""; return; }
  const cl = e.target.closest("[data-client]");
  if (cl) { droid.client = cl.dataset.client; press("seg-client", cl); render(); return; }
  const ar = e.target.closest("[data-armed]");
  if (ar) { droid.armed = ar.dataset.armed === "1"; press("seg-armed", ar); render(); }
});
function press(groupId, btn) {
  document.querySelectorAll(`#${groupId} button`).forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
}
// ---------------------------------------------------------------------------
// The droid: UiProtocol messages over a WebSocket to the S3. Message
// types and layouts match lib/DroidCore/src/UiProtocol.h.
// ---------------------------------------------------------------------------
const UI = { Hello: 0x01, ListSettings: 0x10, SetSetting: 0x11, ClearSetting: 0x12, PlaySound: 0x20, PlayRandom: 0x21,
  Emotion: 0x22, DomeHome: 0x23, DomeGoTo: 0x24, DomeStop: 0x25, RunServoSequence: 0x26, RunAnimation: 0x27,
  StopAll: 0x28, ListAnimations: 0x30, DeleteAnimation: 0x32, ResetAnimations: 0x33, AnimHeader: 0x34,
  AnimStep: 0x35, AnimCommit: 0x36, Status: 0x80, SettingInfo: 0x81, SettingValue: 0x82, ListEnd: 0x83,
  Result: 0x84, ServoSequenceInfo: 0x85, NodeVersion: 0x86, SetWifi: 0x13, WifiInfo: 0x87, OtaStatus: 0x88,
  ServoMoves: 0x29, SeqHeader: 0x38, SeqFrame: 0x39, SeqCommit: 0x3A, DeleteSequence: 0x3B, CopySequence: 0x3C };

class W {  // little-endian writer
  constructor() { this.b = []; }
  u8(v) { this.b.push(v & 255); return this; }
  u16(v) { return this.u8(v).u8(v >> 8); }
  i16(v) { return this.u16(v & 0xffff); }
  u32(v) { return this.u16(v & 0xffff).u16((v >>> 16) & 0xffff); }
  i32(v) { return this.u32(v >>> 0); }
  text(s) { const e = new TextEncoder().encode(s); this.u8(e.length); e.forEach((x) => this.u8(x)); return this; }
  step(s) {
    this.u16(s.atMs).u8(s.kind).u16(s.a).u16(s.b);
    if (s.kind === K.Holo || s.kind === K.Logic || s.kind === K.SoundPick || s.kind === K.Pixels) this.text(s.text);
    return this;
  }
  bytes() { return new Uint8Array(this.b); }
}
class Reader {  // little-endian reader
  constructor(buf) { this.v = new DataView(buf); this.n = 0; }
  u8() { return this.v.getUint8(this.n++); }
  u16() { const x = this.v.getUint16(this.n, true); this.n += 2; return x; }
  i16() { const x = this.v.getInt16(this.n, true); this.n += 2; return x; }
  i32() { const x = this.v.getInt32(this.n, true); this.n += 4; return x; }
  u32() { const x = this.v.getUint32(this.n, true); this.n += 4; return x; }
  text() { const l = this.u8(); const s = new TextDecoder().decode(new Uint8Array(this.v.buffer, this.n, l)); this.n += l; return s; }
  step() {
    const s = { atMs: this.u16(), kind: this.u8(), a: this.u16(), b: this.u16(), text: "" };
    if (s.kind === K.Holo || s.kind === K.Logic || s.kind === K.SoundPick || s.kind === K.Pixels) s.text = this.text();
    return s;
  }
}

const live = {
  ws: null,
  settingIndex: {},  // key -> index on the droid
  overridden: {},    // key -> true when saved away from its default
  gotAnims: false,
  gotSeqs: false,
  keys: [],          // index -> key
  seqFrames: {},
  incoming: [],      // animations arriving
  incomingSeqs: [],
  incomingCustom: {},
  send(w) { if (this.ws && this.ws.readyState === 1) this.ws.send(w.bytes()); },
  sendAnimation(a) {
    const w = new W().u8(UI.AnimHeader).u16(a.id).u8(a.steps.length).text(a.name).text(a.icon || "");
    this.send(w);
    a.steps.forEach((s, i) => this.send(new W().u8(UI.AnimStep).u16(a.id).u8(i).step(s)));
    this.send(new W().u8(UI.AnimCommit).u16(a.id));
  },
};

// Only try on the droid's own network (an IP address or a .local name); the
// published preview has no droid to talk to.
const onDroid = /^(\d+\.){3}\d+$|\.local$|^localhost$/.test(location.hostname);
let renderTimer;
const renderSoon = () => { clearTimeout(renderTimer); renderTimer = setTimeout(() => { if (!drag) render(); }, 120); };

function connect() {
  if (!onDroid) return;
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    live.ws = ws;
    droid.connected = true;
    droid.client = "web";
    live.send(new W().u8(UI.Hello).u8(1));
    render();
  };
  ws.onclose = () => {
    if (live.ws === ws) { live.ws = null; droid.connected = false; live.gotAnims = live.gotSeqs = false; render(); }
    setTimeout(connect, 2000);
  };
  ws.onmessage = (ev) => handleMessage(ev.data);
}

const DOME_MODES = ["manual", "auto", "home"];
const RESULT_TEXT = { 1: "Locked while the drive is armed", 2: "The droid didn't accept that", 3: "The animation library is full",
  4: "The droid doesn't know that one", 5: "Dome moves need the radio link" };
function handleMessage(buf) {
  const r = new Reader(buf);
  const type = r.u8();
  if (type === UI.Status) {
    const flags = r.u16();
    const was = [droid.armed, droid.enableSwitch].join();
    droid.rightRadio = !!(flags & 1);
    droid.armed = !!(flags & 2);
    droid.enableSwitch = !!(flags & 4);
    droid.domeNode = !!(flags & 8);
    droid.utilNode = !!(flags & 16);
    droid.domeMode = DOME_MODES[r.u8()] || "manual";
    const angle = r.i16();
    droid.domeAngle = angle === -32768 ? null : angle;
    document.getElementById("chips").innerHTML = renderChips();
    if (was !== [droid.armed, droid.enableSwitch].join()) render();  // locks may change
  } else if (type === UI.SettingInfo) {
    const index = r.u8(); r.u8();
    const value = r.i32(), def = r.i32(); r.i32(); r.i32();
    const over = !!r.u8(), key = r.text();
    live.overridden[key] = over;
    live.settingIndex[key] = index;
    live.keys[index] = key;
    droid.settings[key] = value;
    defaults[key] = def;
  } else if (type === UI.SettingValue) {
    const key = live.keys[r.u8()];
    if (key) { droid.settings[key] = r.i32(); live.overridden[key] = !!r.u8(); renderSoon(); }
  } else if (type === UI.ServoSequenceInfo) {
    const index = r.u8(), frames = r.u8(), ms = r.u32(), name = r.text();
    live.incomingSeqs[index] = name;
    live.seqFrames[name] = frames;
    seqLengths[name] = Math.round(ms / 10) / 100;
  } else if (type === UI.AnimHeader) {
    const id = r.u16(), count = r.u8(), name = r.text(), icon = r.text();
    live.incoming.push({ id, name, icon, steps: new Array(count) });
  } else if (type === UI.AnimStep) {
    const id = r.u16(), index = r.u8();
    const a = live.incoming.find((x) => x.id === id);
    if (a) a.steps[index] = r.step();
  } else if (type === UI.ListEnd) {
    const list = r.u8();
    if (list === UI.RunServoSequence) {
      seqNames = live.incomingSeqs;  // indexed by number: custom ones start at 64
      live.incomingSeqs = [];
      customSeqs = Object.fromEntries(Object.values(live.incomingCustom).filter((q) => q.frames.every(Boolean)).map((q) => [q.id, q]));
      live.incomingCustom = {};
      live.gotSeqs = true;
      seqListArrived();
    }
    if (list === UI.ListAnimations) {
      animList = live.incoming.map((a) => ({ ...a, steps: a.steps.filter(Boolean) }));
      live.gotAnims = true;
      live.incoming = [];
      if (draft && !draft.dirty) draft = null;   // reopen from the droid's copy
    }
    renderSoon();
  } else if (type === UI.WifiInfo) {
    const custom = !!r.u8(), name = r.text(), password = r.text();
    droid.wifi = { name, password, custom, known: true };
    renderSoon();
  } else if (type === UI.NodeVersion) {
    const node = r.u8(), version = r.text(), build = r.text();
    const name = { 1: "body-s3", 2: "dome-c3", 3: "body-c3" }[node];
    if (name) { droid.versions[name] = { version, build }; fwVersionSeen(name, version, build); renderSoon(); }
  } else if (type === UI.SeqHeader) {
    const id = r.u8(), count = r.u8(), name = r.text();
    live.incomingCustom[id] = { id, name, frames: new Array(count).fill(null) };
  } else if (type === UI.SeqFrame) {
    const id = r.u8(), index = r.u8(), ms = r.u16(), pos = [];
    for (let k = 0; k < SEQ_SERVOS.length; k++) { const b = r.u8(); pos.push(b === 0x80 ? null : b > 127 ? b - 256 : b); }
    const q = live.incomingCustom[id];
    if (q && index < q.frames.length) q.frames[index] = { ms, pos };
  } else if (type === UI.OtaStatus) {
    const node = r.u8(), state = r.u8(), percent = r.u8();
    r.u8();  // error code; the text says it
    fwStatus(node, state, percent, r.text());
  } else if (type === UI.Result) {
    const request = r.u8(), result = r.u8();
    if (bkReply(request, result)) return;
    if (result === 0 && request === UI.AnimCommit) toast("Animation saved");
    else if (request === UI.SeqCommit) seqSaved(result);
    else if (result === 0 && request === UI.CopySequence) toast("Copied: it's at the end of the list, ready to edit");
    else if (result === 1 && request === UI.ServoMoves) toast("Servos only move live while the drive is disarmed");
    else if (result === 0 && request === UI.SetWifi) {
      wifiDraft = null;
      toast(`Saved. The droid's Wi-Fi restarts now: join “${droid.wifi.name}” again with its password.`);
    }
    else if (RESULT_TEXT[result]) toast(RESULT_TEXT[result]);
  }
}

window.addEventListener("hashchange", render);
render();
connect();
</script>
