<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R2-AU Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 800x480 landscape screen (the touch display's size): a
   status bar on top, the current screen below. On a phone it goes fluid and
   the menu tiles stack. System fonts only: the droid's access point has no
   internet, and the display copies this layout in LVGL. */
:root {
  /* Colours sampled from a photo of the droid: white body,
     aqua-teal panels, matte gold dome band. */
  --bg: #e7eef0;          /* page around the screen */
  --screen: #f6f9fa;      /* the 800x480 screen */
  --panel: #ffffff;       /* tiles, like the white body panels */
  --line: #c9d8dd;
  --fg: #11222a;
  --muted: #526a73;
  --paint-teal: #4cb8cf;  /* the panel paint */
  --paint-gold: #c9a35f;  /* the dome band */
  --accent: #147489;      /* paint teal, darkened for text and buttons (4.6:1 on its soft tint) */
  --accent-soft: #dbf1f6;
  --on-accent: #ffffff;   /* text on teal */
  --gold: #7f5f1e;        /* paint gold, darkened for text (4.5:1+ on white and its soft tint) */
  --gold-soft: #f5ecd9;
  --ok: #2d852d;
  --warn: #c2410c;
  --crit: #b3261e;
  --chip-bg: #eaf1f3;
  /* Emotion colours: happy green, mad red, sad blue, scared yellow.
     -ink is the readable text shade, -soft the faded end of the gradient. */
  --happy: #2a9d55; --happy-ink: #1f7a41; --happy-soft: #d3f0dd;
  --mad: #d23a2e;   --mad-ink: #b02d23;   --mad-soft: #f8d6d2;
  --sad: #2f6fd0;   --sad-ink: #2559a8;   --sad-soft: #d5e3f8;
  --scared: #e6b400; --scared-ink: #8a6b00; --scared-soft: #faf0c4;
  /* Extra tile hues for Droid Control, alongside the droid's teal and gold */
  --violet: #6b4fc8; --violet-soft: #e7e1f8;
  --sky: #2f86d6;    --sky-soft: #d9e9f9;
  --crit-soft: #f8d8d4;
  /* Fills with something on them, and what goes on them (4.5:1 or better).
     The paint teal and gold are light, so they carry dark ink, not white. */
  --ink: #0f2329;
  --fill-teal: #4cb8cf; --on-teal: var(--ink);
  --fill-gold: #c9a35f; --on-gold: var(--ink);
  --fill-sky: #2a78c0; --on-sky: #ffffff;
  --fill-happy: #238548; --on-happy: #ffffff;
  --fill-violet: #6b4fc8; --on-violet: #ffffff;
  --fill-red: #b3261e; --on-red: #ffffff;
  --orange: #c2410c; --orange-soft: #fde4d6; --fill-orange: #c2410c; --on-orange: #ffffff;  /* dome moves */
  --pink: #b02a6f; --pink-soft: #f9dcea; --fill-pink: #b02a6f; --on-pink: #ffffff;  /* body lights */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c0e; --screen: #0e161a; --panel: #152127; --line: #263840;
    --fg: #e4eef1; --muted: #8fa7af; --paint-teal: #4cb8cf; --paint-gold: #c9a35f;
    --accent: #5ccbe2; --accent-soft: #12333c; --on-accent: #05262e;
    --gold: #dcb76e; --gold-soft: #3a2f17;
    --ok: #74d474; --warn: #f28c55; --crit: #f07a70; --chip-bg: #1a272c;
    --happy: #5fd17f; --happy-ink: #5fd17f; --happy-soft: #163a24;
    --mad: #f0776c; --mad-ink: #f0776c; --mad-soft: #43201c;
    --sad: #70a5f2; --sad-ink: #70a5f2; --sad-soft: #182b47;
    --scared: #f2cf4a; --scared-ink: #f2cf4a; --scared-soft: #3d3413;
    --violet: #a993f2; --violet-soft: #2a2443; --sky: #72b3f2; --sky-soft: #152a40; --crit-soft: #43201c;
    --fill-teal: #4cb8cf; --on-teal: #0b1418; --fill-gold: #c9a35f; --on-gold: #0b1418;
    --fill-sky: #72b3f2; --on-sky: #0b1418; --fill-happy: #5fd17f; --on-happy: #0b1418;
    --fill-violet: #a993f2; --on-violet: #0b1418; --fill-red: #f07a70; --on-red: #0b1418;
    --orange: #f28c55; --orange-soft: #3d2414; --fill-orange: #f28c55; --on-orange: #0b1418;
    --pink: #f28cc1; --pink-soft: #3d1a2c; --fill-pink: #f28cc1; --on-pink: #0b1418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070c0e; --screen: #0e161a; --panel: #152127; --line: #263840;
    --fg: #e4eef1; --muted: #8fa7af; --paint-teal: #4cb8cf; --paint-gold: #c9a35f;
    --accent: #5ccbe2; --accent-soft: #12333c; --on-accent: #05262e;
    --gold: #dcb76e; --gold-soft: #3a2f17;
    --ok: #74d474; --warn: #f28c55; --crit: #f07a70; --chip-bg: #1a272c;
    --happy: #5fd17f; --happy-ink: #5fd17f; --happy-soft: #163a24;
    --mad: #f0776c; --mad-ink: #f0776c; --mad-soft: #43201c;
    --sad: #70a5f2; --sad-ink: #70a5f2; --sad-soft: #182b47;
    --scared: #f2cf4a; --scared-ink: #f2cf4a; --scared-soft: #3d3413;
    --violet: #a993f2; --violet-soft: #2a2443; --sky: #72b3f2; --sky-soft: #152a40; --crit-soft: #43201c;
    --fill-teal: #4cb8cf; --on-teal: #0b1418; --fill-gold: #c9a35f; --on-gold: #0b1418;
    --fill-sky: #72b3f2; --on-sky: #0b1418; --fill-happy: #5fd17f; --on-happy: #0b1418;
    --fill-violet: #a993f2; --on-violet: #0b1418; --fill-red: #f07a70; --on-red: #0b1418;
    --orange: #f28c55; --orange-soft: #3d2414; --fill-orange: #f28c55; --on-orange: #0b1418;
    --pink: #f28cc1; --pink-soft: #3d1a2c; --fill-pink: #f28cc1; --on-pink: #0b1418;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Elements that set display (.preview, .bar .back) would otherwise ignore hidden. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen {
  width: 800px; height: 480px; max-width: 100%;
  background: var(--screen); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}

/* Status bar: 52px, always visible */
.bar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; border-bottom: 4px solid var(--paint-gold);
}
.bar h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; color: var(--gold); }
.bar .back {
  height: 36px; padding: 0 12px 0 8px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
}
.bar .back svg { width: 18px; height: 18px; }
.chips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip {
  height: 26px; padding: 0 9px; border-radius: 13px; background: var(--chip-bg);
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted);
  white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.ok i { background: var(--ok); }
.chip.warn i { background: var(--warn); }
.chip.crit i { background: var(--crit); }
.chip.armed { background: var(--fill-red); color: var(--on-red); }
.chip.armed i { background: var(--on-red); }

.body { flex: 1; min-height: 0; padding: 14px; overflow: auto; }

/* Menu: 2 x 2 tiles filling the screen */
.menu { height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; }
.tile {
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px; cursor: pointer; display: grid; grid-template-columns: 56px 1fr;
  grid-template-rows: auto 1fr; column-gap: 16px; align-content: start; position: relative;
}
.tile:hover:not(:disabled) { border-color: var(--gold); }
.tile:active:not(:disabled) { background: var(--gold-soft); border-color: var(--gold); }
.tile .ico {
  grid-row: 1 / 3; width: 56px; height: 56px; border-radius: 12px; background: var(--fill-teal);
  color: var(--on-teal); display: grid; place-items: center;
}
.tile .ico svg { width: 30px; height: 30px; }
.tile strong { font-size: 21px; line-height: 1.2; align-self: end; }
.tile span.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.tile .tag {
  position: absolute; right: 14px; bottom: 14px; font-size: 11.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--gold); border: 1px solid currentColor;
  border-radius: 6px; padding: 2px 7px;
}
.tile .tag.lock { color: var(--warn); }
.tile:disabled { cursor: not-allowed; opacity: .55; }
.tile:disabled .ico { background: var(--chip-bg); color: var(--muted); }
.tile:disabled .tag { color: var(--muted); }
.tile.locked:disabled .tag { color: var(--warn); }
.tile.locked:disabled .sub { color: var(--warn); }

/* Settings: a scrolling list of full-width tiles, same look as the menu */
.rows { display: grid; gap: 10px; }
.tile.row {
  grid-template-columns: 48px minmax(0, 1fr) auto 20px; grid-template-rows: auto auto;
  align-items: center; min-height: 76px; padding: 12px 16px; border-radius: 12px;
}
.tile.row .ico { width: 48px; height: 48px; border-radius: 11px; }
.tile.row .ico svg { width: 26px; height: 26px; }
.tile.row strong { font-size: 18px; grid-column: 2; }
.tile.row .sub { grid-column: 2; margin-top: 2px; font-size: 13.5px; font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.row .tag { position: static; grid-column: 3; grid-row: 1 / 3; margin-left: 12px; }
.tile.row .chev { grid-column: 4; grid-row: 1 / 3; color: var(--muted); width: 20px; height: 20px; }
.section {
  margin: 8px 0 -2px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); display: flex; align-items: center; gap: 10px;
}
.section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.rows .section:first-child { margin-top: 0; }
.lead { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }

/* Setting detail: one card per control */
.ctls { display: grid; gap: 10px; }
.ctl {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px 10px; display: grid; gap: 6px; min-width: 0;
}
.ctl-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 30px; }
.ctl-head b { font-size: 16px; }
.ctl-head .right { display: flex; align-items: center; gap: 10px; }
.val { font-size: 17px; font-weight: 650; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.saved { font-size: 12px; color: var(--ok); opacity: 0; }
.saved.on { opacity: 1; }
.ctl-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { font: 12px var(--mono); color: var(--muted); margin-right: auto; overflow-wrap: anywhere; }
.step {
  width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  font-size: 18px; line-height: 1; cursor: pointer;
}
.link { background: none; border: 0; color: var(--accent); font-size: 13px; cursor: pointer; padding: 8px 6px; min-height: 32px; }
.note-sm { margin: 0; font-size: 13px; color: var(--muted); }

/* Multi-thumb slider: 1 thumb (value), 2 (low/high) or 4 (servo) */
.ms { position: relative; height: 46px; margin: 0 14px; touch-action: none; cursor: pointer; }
.ms-track, .ms-zone, .ms-fill { position: absolute; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 4px; }
.ms-track { left: -14px; right: -14px; background: var(--chip-bg); border: 1px solid var(--line); }
.ms-zone { background: var(--accent-soft); }
.ms-fill { background: var(--accent); }
.ms-thumb {
  position: absolute; top: 50%; width: 30px; height: 30px; margin-left: -15px; transform: translateY(-50%);
  border-radius: 50%; background: var(--accent); color: var(--on-accent); border: 3px solid var(--panel);
  box-shadow: 0 0 0 1px var(--accent); padding: 0; font-size: 11px; font-weight: 700; cursor: grab;
  display: grid; place-items: center;
}
.ms-thumb.limit { width: 14px; height: 38px; margin-left: -7px; border-radius: 5px; background: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.ms-thumb.sel { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--gold); }
.ms-thumb:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.legend button {
  border: 1px solid var(--line); background: var(--chip-bg); border-radius: 8px; padding: 5px 10px;
  font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; color: var(--muted);
}
.legend button b { color: var(--fg); font-weight: 650; }
.legend button[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }

/* Emotion sliders: coloured gradient track and an emoji that grows with the level */
[data-emo="happy"] { --emo: var(--happy); --emo-ink: var(--happy-ink); --emo-soft: var(--happy-soft); }
[data-emo="mad"] { --emo: var(--mad); --emo-ink: var(--mad-ink); --emo-soft: var(--mad-soft); }
[data-emo="sad"] { --emo: var(--sad); --emo-ink: var(--sad-ink); --emo-soft: var(--sad-soft); }
[data-emo="scared"] { --emo: var(--scared); --emo-ink: var(--scared-ink); --emo-soft: var(--scared-soft); }
.ctl[data-emo] .ms-track { background: linear-gradient(90deg, var(--chip-bg), var(--emo-soft)); }
.ctl[data-emo] .ms-fill { background: linear-gradient(90deg, var(--emo-soft), var(--emo)); background-repeat: no-repeat; }
.ctl[data-emo] .ms-thumb { background: var(--emo); box-shadow: 0 0 0 1px var(--emo); }
.ctl[data-emo] .val { color: var(--emo-ink); }
.ctl[data-emo] { border-left: 4px solid var(--emo); }
.emo { display: inline-block; width: 34px; height: 34px; margin-right: 8px; vertical-align: middle; }
.bar .logo { width: 34px; height: 34px; flex: none; }
.emo-sm { width: 22px; height: 22px; vertical-align: -6px; margin-right: 3px; }

/* Droid Control: tabs and tap tiles */
.tabs {
  display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: -14px; z-index: 2;
  margin: -14px -14px 12px; padding: 12px 14px 10px; background: var(--screen); border-bottom: 1px solid var(--line);
}
.tabs button {
  height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel);
  font-weight: 600; cursor: pointer; color: var(--fg); display: inline-flex; align-items: center; gap: 8px;
}
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tabs .hint-r { margin-left: auto; align-self: center; font-size: 12.5px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
/* Action tiles: a coloured icon square, tinted by what the tile does */
.ptile {
  --h: var(--paint-teal); --h-soft: var(--accent-soft); --h-fill: var(--fill-teal); --h-on: var(--on-teal);
  text-align: left; min-height: 60px; padding: 9px 12px; border-radius: 12px;
  border: 1px solid var(--h-soft); cursor: pointer; min-width: 0;
  background: linear-gradient(100deg, var(--h-soft) 0%, var(--panel) 62%);
  display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; column-gap: 11px;
}
.ptile .pico {
  grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 10px; background: var(--h-fill); color: var(--h-on);
  display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15);
}
.ptile .pico svg { width: 23px; height: 23px; }
.ptile .pico.pimg { background: none; box-shadow: none; }
.ptile .parts { display: flex; gap: 5px; color: var(--muted); }
.ptile .parts svg { width: 15px; height: 15px; }
.ptile .pico.pimg img { width: 44px; height: 44px; }
.ptile b { font-size: 15px; line-height: 1.25; }
.ptile small { font: 12px var(--mono); color: var(--muted); }
.ptile:hover { border-color: var(--h); }
.ptile.sent { background: var(--h-soft); border-color: var(--h); transform: scale(.97); }
.hue-teal { --h: var(--paint-teal); --h-soft: var(--accent-soft); --h-fill: var(--fill-teal); --h-on: var(--on-teal); }
.hue-gold { --h: var(--paint-gold); --h-soft: var(--gold-soft); --h-fill: var(--fill-gold); --h-on: var(--on-gold); }
.hue-violet { --h: var(--violet); --h-soft: var(--violet-soft); --h-fill: var(--fill-violet); --h-on: var(--on-violet); }
.hue-sky { --h: var(--sky); --h-soft: var(--sky-soft); --h-fill: var(--fill-sky); --h-on: var(--on-sky); }
.hue-red { --h: var(--crit); --h-soft: var(--crit-soft); --h-fill: var(--fill-red); --h-on: var(--on-red); }
.hue-red b { color: var(--crit); }
.etiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.etile {
  min-height: 150px; border-radius: 14px; border: 1px solid var(--line); border-bottom: 5px solid var(--emo, var(--accent));
  background: linear-gradient(180deg, var(--panel) 55%, var(--emo-soft, var(--accent-soft))); cursor: pointer;
  display: grid; justify-items: center; align-content: center; gap: 6px; padding: 10px;
}
.etile img { width: 76px; height: 76px; }
.etile b { font-size: 16px; color: var(--emo-ink, var(--accent)); }
.etile small { font-size: 12px; color: var(--muted); }
.etile.sent { outline: 3px solid var(--emo, var(--accent)); outline-offset: 2px; }
.dome-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.panel-note {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  font-size: 13px; color: var(--muted); display: grid; gap: 4px; margin-bottom: 12px;
}
.panel-note b { color: var(--fg); }
.toast {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5;
  background: var(--fg); color: var(--screen); border-radius: 18px; padding: 8px 16px; font-size: 13.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; pointer-events: none; width: max-content;
  max-width: min(92%, 520px); text-align: center;
}
.toast.on { opacity: 1; }

/* Settings > Animations: the list */
.lhead { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
.lhead .lead { margin: 0; flex: 1 1 260px; }
.tile.row.arow { grid-template-columns: 48px minmax(0, 1fr) auto 20px; }
.tile.row .ico.aimg { background: none; }
.tile.row .ico.aimg img { width: 48px; height: 48px; }
.tile.row .kinds { grid-column: 3; grid-row: 1 / 3; display: flex; gap: 6px; color: var(--muted); margin-left: 10px; }
.tile.row .kinds svg { width: 18px; height: 18px; }
.warn-t { color: var(--warn); font-style: normal; }
.ok-t { color: var(--ok); }
.seqs { display: grid; gap: 8px; }
.item.seq { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.item.seq small { display: block; }
.item.seq .used { color: var(--muted); font-size: 12.5px; }
.seqopen { all: unset; cursor: pointer; flex: 1; min-width: 0; display: grid; gap: 2px; padding: 4px 0; }
.seqopen:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.seqopen b { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.sqframes { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.sqf { flex: none; min-width: 64px; min-height: 56px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  color: var(--fg); display: grid; justify-items: center; align-content: center; gap: 1px; cursor: pointer; padding: 4px 8px; }
.sqf b { font-size: 16px; }
.sqf small { font-size: 11.5px; color: var(--muted); }
.sqf[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
.sqpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.sqpanel h3 { margin: 0; font-size: 15px; }
.sqbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.sqg { margin: 6px 0 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.sqrow { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 4.2em; gap: 10px; align-items: center; min-height: 44px; }
.sqrow label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.sqrow input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.sqrow input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.sqrow output { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.sqrow.off output { color: var(--muted); }
@media (max-width: 520px) { .sqrow { grid-template-columns: minmax(0, 1fr) 4.2em; } .sqrow input[type="range"] { grid-column: 1 / -1; grid-row: 2; } }
.actions.foot { margin-top: 16px; }
.btn.danger { color: var(--crit); border-color: var(--crit); }
@media (max-width: 600px) { .tile.row .kinds { display: none; } }

/* The animation editor */
.ed { display: grid; gap: 12px; }
.edtop {
  display: grid; grid-template-columns: 56px minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 12px; align-items: end;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
.edimg img { width: 56px; height: 56px; display: block; }
.edstat { display: grid; justify-items: end; gap: 1px; font-size: 12px; color: var(--muted); }
.edstat b { font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }
.fld { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld input, .fld select {
  height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg);
  font: 15px var(--font); padding: 0 10px; min-width: 0; width: 100%;
}
.fld input.raw { font: 14px var(--mono); }
.fld input[type="number"] { font-variant-numeric: tabular-nums; }
.fhint { font-size: 12px; color: var(--muted); margin: 0; align-self: center; }
.fhint.wide { grid-column: 1 / -1; }
.sbody > .wide { grid-column: 1 / -1; }  /* previews, pickers, rows of chips: the item's full width */

.tl { --lw: 92px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 14px; display: grid; gap: 8px; }
.tlhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tlhead b { font-size: 15px; }
.ticks { position: relative; height: 18px; margin-left: calc(var(--lw) + 10px); margin-right: 8px; }
.tick { position: absolute; top: 0; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tick:first-child { transform: none; }
.lane { display: grid; grid-template-columns: var(--lw) 1fr; gap: 10px; align-items: center; }
.lname {
  height: 32px; border-radius: 8px; background: var(--h-fill); color: var(--h-on); display: flex; align-items: center; gap: 6px;
  padding: 0 8px; font-size: 13px; font-weight: 600; overflow: hidden;
}
.lname svg { width: 17px; height: 17px; flex: none; }
/* the track has 8px spare on the right so a mark at the end stays in view */
.ltrack {
  position: relative; height: 32px; margin-right: 8px; border-radius: 8px;
  background: linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / var(--tick, 10%) 100% repeat-x, var(--chip-bg);
}
.mark {
  position: absolute; top: 3px; height: 26px; min-width: 26px; margin-left: -13px; border-radius: 13px; padding: 0;
  background: var(--h-fill); border: 3px solid var(--panel); cursor: grab; touch-action: none;
  box-shadow: 0 0 0 1px var(--fg), 0 1px 3px rgba(0,0,0,.25);
}
.mark::before {  /* grip lines, so it reads as something to drag */
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 10px; transform: translate(-50%, -50%);
  background: linear-gradient(90deg, #fff 0 2px, transparent 2px 3px, #fff 3px 5px, transparent 5px 6px, #fff 6px 8px); opacity: .85;
}
/* "long", not "bar": .bar is the status bar, whose phone rules made these sticky and 52px tall */
.mark.long { margin-left: 0; border-radius: 7px; }
.mark.long::before { left: 13px; }
.mark:hover { box-shadow: 0 0 0 2px var(--h); }
.mark.dragging { cursor: grabbing; z-index: 3; box-shadow: 0 0 0 3px var(--h), 0 4px 10px rgba(0,0,0,.3); }
.mark.dragging::after { display: none; }

.scards { display: grid; gap: 10px; }
.scard {
  background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--h);
  border-radius: 12px; padding: 10px 14px 12px; display: grid; gap: 10px; min-width: 0; scroll-margin: 20px;
}
.scard.flash { box-shadow: 0 0 0 3px var(--h); }
.shead { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sico { width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--h-fill); color: var(--h-on); display: grid; place-items: center; }
.sico svg { width: 19px; height: 19px; }
.stitle { min-width: 0; flex: 1; }
.stitle b, .stitle .ititle { display: block; font-size: 15px; }
.stitle small { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.at { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.at input {
  width: 76px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg);
  font: 600 15px var(--font); text-align: center; font-variant-numeric: tabular-nums;
}
.sdel { min-width: 36px; padding: 0 8px !important; white-space: nowrap; font-size: 13px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
.sdel svg { width: 16px; height: 16px; }
.sdel:hover { color: var(--crit); border-color: var(--crit); }
.sbody { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.hpchips { display: flex; gap: 6px; flex-wrap: wrap; }
.hp, .syms button {
  height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel);
  color: var(--fg); font-weight: 600; cursor: pointer;
}
.hp[aria-pressed="true"] { background: var(--h-fill); border-color: var(--h-fill); color: var(--h-on); }
.hp:disabled { cursor: not-allowed; opacity: .6; }
.syms { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.syms button { height: 32px; padding: 0 12px; font-weight: 500; }
.lpreview { font: 700 14px var(--mono); letter-spacing: .08em; color: var(--h); }
.adds { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.addb {
  height: 44px; padding: 0 14px 0 6px; border-radius: 10px; border: 1px dashed var(--h); background: var(--h-soft);
  color: var(--fg); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.addb .sico { width: 30px; height: 30px; }
.addb:disabled { opacity: .45; cursor: not-allowed; }
.hue-pink { --h: var(--pink); --h-soft: var(--pink-soft); --h-fill: var(--fill-pink); --h-on: var(--on-pink); }
.hue-orange { --h: var(--orange); --h-soft: var(--orange-soft); --h-fill: var(--fill-orange); --h-on: var(--on-orange); }
.hue-happy { --h: var(--happy); --h-soft: var(--happy-soft); --h-fill: var(--fill-happy); --h-on: var(--on-happy); }

.pwrow { display: flex; gap: 8px; }
.pwrow input {
  flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  color: var(--fg); font: 16px var(--mono); padding: 0 10px;
}
.pwrow .btn { height: 40px; }
#wifi-name { height: 40px; font-size: 16px; }

/* Lights item: a live preview strip, colour swatches */
.pxprev {
  display: flex; gap: 3px; padding: 8px; border-radius: 10px; background: #0b1418; overflow: hidden; flex-wrap: nowrap;
}
.pxprev span { flex: 1 1 0; min-width: 3px; max-width: 14px; height: 12px; border-radius: 6px; background: #26353b; }
.pxcols { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pxcol { display: inline-flex; align-items: center; gap: 2px; }
.pxcol input[type="color"] { width: 48px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
.btn.pxadd { height: 38px; padding: 0 12px; font-size: 13.5px; }
.fld.chk { display: flex; align-items: center; gap: 8px; align-self: end; height: 38px; }
.fld.chk input { width: 22px; height: 22px; }

/* Logic item: display grids and colour swatches */
.lgprev {
  container-type: inline-size; display: grid; gap: 8px; padding: 10px; border-radius: 10px; background: #0b1418;
  color: #9fb3ba; font-size: 11.5px; min-width: 0;
}
.lgset { display: grid; gap: 3px; justify-items: start; min-width: 0; }
.lgset.lgpsis { grid-auto-flow: column; justify-content: start; gap: 24px; }
.lgset.lgpsis > div { display: grid; gap: 3px; }
.lgname { font-size: 11px; letter-spacing: .04em; }
.lgpair { display: flex; gap: 10px; }
/* Fixed-size LEDs (a ratio-based size overflowed onto the controls below),
   sized from the preview's width so the long rear logic always fits. */
.lgpanel { --cell: 6px; display: grid; grid-template-columns: repeat(var(--c), var(--cell)); grid-auto-rows: var(--cell); gap: 2px; width: max-content; }
.lgpanel.lgr { --cell: min(10px, calc((100cqw - 52px) / 27)); }
.lgpanel.lgf { --cell: min(12px, calc((100cqw - 42px) / 18)); }
.lgpanel.psi { --cell: 9px; gap: 1px; }
.lgpanel span { border-radius: 2px; background: #26353b; }
.lgpanel.psi span { border-radius: 50%; }
.lgpanel span.o { visibility: hidden; }
.lgpanel.idle { opacity: .35; }
.lgnote { margin: 0; font-size: 12px; color: #9fb3ba; }
.lgswatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lgsw {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: var(--sw); cursor: pointer; padding: 0;
}
.lgsw.def { background: conic-gradient(#0030ff, #ffffff, #00ff00, #ffff00, #ff0000, #0030ff); }
.lgsw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--fg); }


/* For screen readers only */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.errbox {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px;
  background: var(--crit-soft); border: 1px solid var(--crit); color: var(--fg); font-size: 14px;
}
.errbox b { color: var(--crit); }
.errbox:focus { outline: 3px solid var(--crit); outline-offset: 2px; }
h2.tlh { margin: 0; font-size: 15px; }
.ititle { margin: 0; font-size: 15px; }
.ititle:focus, [tabindex="-1"]:focus { outline: none; }
.ititle:focus-visible, h1:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Blocks: number and start time on the left, one line per item */
.blocks { display: grid; gap: 8px; }
.block {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; min-width: 0; scroll-margin: 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 8px 8px;
}
.block.flash { box-shadow: 0 0 0 3px var(--paint-gold); }
.bgut { display: grid; justify-items: center; align-content: start; gap: 4px; padding-top: 2px; }
.bnum {
  width: 30px; height: 30px; border-radius: 50%; background: var(--fill-gold); color: var(--on-gold); font-weight: 700;
  display: grid; place-items: center;
}
.btime { display: flex; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.btime input {
  width: 46px; height: 28px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--gold);
  font: 700 14px var(--font); text-align: right; font-variant-numeric: tabular-nums; padding: 0 2px; -moz-appearance: textfield;
}
.btime input::-webkit-inner-spin-button, .btime input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.btime input:hover, .btime input:focus { border-color: var(--line); background: var(--panel); }
.bmain { display: grid; gap: 4px; min-width: 0; }
.iline {
  display: grid; grid-template-columns: 28px auto minmax(0, 1fr) 16px; align-items: center; gap: 10px; min-height: 40px;
  padding: 4px 6px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; width: 100%;
}
.iline:hover { background: var(--h-soft); }
.iline .sico { width: 28px; height: 28px; border-radius: 7px; }
.iline .sico svg { width: 16px; height: 16px; }
.iname { font-weight: 600; font-size: 14px; white-space: nowrap; }
.isum { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ichev { color: var(--muted); display: grid; }
.ichev svg { width: 16px; height: 16px; }
.bitem {
  border: 1px solid var(--h); border-radius: 10px; padding: 8px 12px 12px; margin: 2px 0;
  display: grid; gap: 10px; min-width: 0; background: linear-gradient(180deg, var(--h-soft) 0, var(--panel) 56px);
}
.ihead { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ihead .btn.sdone { height: 34px; padding: 0 14px; }
.danger-t { color: var(--crit); }
.bfoot { display: flex; gap: 14px; align-items: center; padding: 0 2px; }
.bfoot .danger-t { margin-left: auto; opacity: .8; font-size: 12.5px; }
.addlink { font-weight: 600; }
.link:disabled { opacity: .45; cursor: not-allowed; }
.addrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0; }
.addk {
  height: 36px; padding: 0 12px 0 4px; border-radius: 18px; border: 1px solid var(--h); background: var(--h-soft);
  color: var(--fg); font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.addk .sico { width: 28px; height: 28px; border-radius: 50%; }
.addk .sico svg { width: 15px; height: 15px; }
.addk:disabled { opacity: .4; cursor: not-allowed; }
.addblock { justify-self: start; }
.adv { font-size: 12.5px; color: var(--muted); }
.adv summary { cursor: pointer; padding: 2px 0; }
.adv input {
  margin-top: 6px; width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  color: var(--fg); font: 14px var(--mono); padding: 0 10px;
}
@media (max-width: 600px) {
  .block { grid-template-columns: 48px minmax(0, 1fr); }
  .iline { grid-template-columns: 28px minmax(0, 1fr) 16px; }
  .iname { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }  /* still read out */
}

/* Sound item: chosen sounds as chips; the list only while choosing */
.schosen { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.schip {
  display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 12px; border-radius: 15px;
  background: var(--h-fill); color: var(--h-on); font-size: 13.5px; font-weight: 600;
}
.schip button {
  width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: inherit; padding: 0;
  display: grid; place-items: center; cursor: pointer; opacity: .85;
}
.schip button:hover { background: color-mix(in srgb, currentColor 20%, transparent); opacity: 1; }
.schip svg { width: 13px; height: 13px; }
.btn.sopen { height: 32px; padding: 0 12px; font-size: 13.5px; }
.sbar { display: flex; gap: 8px; align-items: center; }
.sbar input {
  flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  color: var(--fg); font: 15px var(--font); padding: 0 10px;
}
.scount { font-size: 13px; color: var(--muted); white-space: nowrap; }
.btn.sdone { height: 38px; padding: 0 16px; }
.spick {
  display: grid; gap: 10px; max-height: 230px; overflow: auto; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--screen);
}
.sghead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.sgname { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sgchips { display: flex; flex-wrap: wrap; gap: 5px; }
.snd, .sall {
  height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line); background: var(--panel);
  color: var(--fg); font-size: 13px; cursor: pointer;
}
.snd[aria-pressed="true"] { background: var(--h-fill); border-color: var(--h-fill); color: var(--h-on); font-weight: 600; }
.sall { height: 28px; padding: 0 10px; font-size: 12px; color: var(--accent); background: none; border: 0; }
.snd[hidden], .sgroup[hidden] { display: none; }

/* Holoprojectors: a row per HP, lights and movement each */
.hrows { display: grid; gap: 6px; }
.hrow {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center;
  padding: 6px 0; border-top: 1px solid var(--line);
}
.hrow > b { font-size: 14px; }
.hcell { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.hlab { width: 100%; font-size: 11.5px; color: var(--muted); }
.hcell select {
  height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg);
  font: 14px var(--font); padding: 0 8px; min-width: 0; flex: 1 1 130px;
}
.hcell select:first-of-type:has(option:checked[value=""]) { color: var(--muted); }
.secs { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.secs input {
  width: 62px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg);
  font: 14px var(--font); text-align: center;
}

/* Timeline blocks row */
.lname.blocks { background: var(--fill-gold); color: var(--on-gold); justify-content: center; }
.btrack { background: linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / var(--tick, 10%) 100% repeat-x, var(--gold-soft); }
.bchip {
  position: absolute; top: 2px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; padding: 0;
  background: var(--fill-gold); color: var(--on-gold); font-weight: 700; font-size: 13px; border: 3px solid var(--panel);
  cursor: grab; touch-action: none; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.bchip.dragging { cursor: grabbing; z-index: 3; box-shadow: 0 0 0 3px var(--paint-gold), 0 4px 10px rgba(0,0,0,.3); }
.bchip.dragging::after {
  content: attr(data-t); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--fg); color: var(--screen); font: 600 12px var(--font); padding: 3px 8px; border-radius: 6px;
  white-space: nowrap; pointer-events: none;
}
.mark { cursor: grab; }
.mark::before { display: none; }
@media (max-width: 600px) {
  .hrow { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .tl { --lw: 34px; }
  .lname span { display: none; }
  .edtop { grid-template-columns: 56px minmax(0, 1fr); }
  .edtop .fld:nth-of-type(2), .edstat { grid-column: 1 / -1; }
  .edstat { justify-items: start; grid-auto-flow: column; gap: 10px; align-items: baseline; }
  .shead { flex-wrap: wrap; }
}

/* On/off switch and number stepper */
.switch {
  width: 54px; height: 32px; border-radius: 16px; background: var(--chip-bg); border: 1px solid var(--line);
  position: relative; cursor: pointer; padding: 0; flex: none;
}
.switch::after {
  content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted);
}
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { left: 26px; background: var(--on-accent); }
.num {
  width: 84px; height: 36px; text-align: center; font: 600 16px var(--font); font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg);
}
.stepper { display: flex; gap: 6px; align-items: center; }

/* Simple screens (placeholders, Firmware Update) */
.stub { display: grid; gap: 12px; align-content: start; }
.stub p { margin: 0; color: var(--muted); max-width: 62ch; }
.fwcard { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 12px;
  padding: 12px 14px; display: grid; gap: 8px; }
.fwcard.bad { border-left-color: var(--crit); }
.fwcard p { color: var(--fg); overflow-wrap: anywhere; }
.fwcard b { overflow-wrap: anywhere; }
.fwbar { height: 10px; border-radius: 5px; background: var(--chip-bg); overflow: hidden; }
.fwbar i { display: block; height: 100%; background: var(--accent); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.item {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  min-width: 0;
}
.item b { display: block; font-size: 15px; }
.item small { color: var(--muted); font-size: 13px; }
.item code { font: 12.5px var(--mono); color: var(--muted); }
.node { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.node code { font-variant-numeric: tabular-nums; text-align: right; }
.node code .build { display: block; font-size: 11.5px; color: var(--muted); }
.node.odd { border-color: var(--warn); }
.node .warn-t { display: block; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  height: 44px; padding: 0 18px; border-radius: 9px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer;
}
.btn.secondary { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.note { font-size: 13px; color: var(--warn); }

/* Preview controls, only while no droid is connected */
.preview {
  width: 800px; max-width: 100%; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
  font-size: 13px; color: var(--muted);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

@media (max-width: 520px) {
  .tile.row .sub { white-space: normal; }
}
@media (max-width: 832px) {
  /* Phones: one scroll, the page's. The 800x480 box (the touch display's
     size) with its own scrolling area inside fought with the page's. */
  /* Body grows with the page, and the box with its content: as a flex item
     of a viewport-high body it shrank to 480px and the rest spilled out. */
  html, body { height: auto; min-height: 100%; }
  .screen { width: 100%; height: auto; min-height: 480px; overflow: visible; flex: none; }
  .body { overflow: visible; flex: none; }
  .bar {
    height: auto; min-height: 52px; flex-wrap: wrap; padding-block: 8px;
    position: sticky; top: 0; z-index: 4; background: var(--screen); border-radius: 10px 10px 0 0;
  }
  .tabs { position: static; }
  .spick { overscroll-behavior: contain; }
  .menu { grid-template-columns: 1fr; grid-template-rows: none; height: auto; }
  .tile { min-height: 116px; }
  /* iPhone Safari zooms in on any field under 16px when it's tapped, and
     stays zoomed: the page then overlaps and runs off the side. */
  input, select, textarea { font-size: 16px !important; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile, .btn { transition: border-color .15s, background-color .15s; }
  .saved, .toast { transition: opacity .3s; }
  .ptile, .etile { transition: background-color .2s, border-color .2s, transform .12s; }
  .switch::after { transition: left .15s; }
}
</style>
</head>
<body>

<main class="screen">
  <header class="bar">
    <button class="back" id="back" hidden aria-label="Back to menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span id="back-label">Menu</span>
    </button>
    <img class="logo" src="emoji/neutral.svg" alt="" width="34" height="34">
    <h1 id="title" tabindex="-1">R2-AU</h1>
    <div class="chips" id="chips"></div>
  </header>
  <div class="body" id="view"></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="sr-only" id="sr" aria-live="polite"></div>
</main>

<div class="preview" id="preview">
  <span>Preview, no droid connected:</span>
  <span>Shown on
    <span class="seg" id="seg-client">
      <button id="as-web" data-client="web" aria-pressed="true">Web page</button>
      <button id="as-display" data-client="display" aria-pressed="false">Touch display</button>
    </span>
  </span>
  <span>Drive
    <span class="seg" id="seg-armed">
      <button id="drive-off" data-armed="0" aria-pressed="true">Disarmed</button>
      <button id="drive-on" data-armed="1" aria-pressed="false">Armed</button>
    </span>
  </span>
</div>

<script>
// What the S3 reports. Until a droid connects this is example data, driven by
// the preview bar.
const droid = {
  connected: false,
  client: "web",           // "web" over WiFi, or "display" (ESP-NOW node 4)
  armed: false,
  enableSwitch: false,     // drive enable switch on the radio
  rightRadio: true,        // SBUS link on the S3
  domeNode: true,          // dome-c3 heartbeat
  utilNode: true,          // body-c3 heartbeat
  versions: { "body-s3": null, "dome-c3": null, "body-c3": null },  // reported by each board
  // The access point. The S3 sends the real name and password once connected.
  wifi: { name: "R2-AU", password: "", custom: false, known: false },
  domeMode: "manual",      // from CH5 on the radio: manual, auto or home (it owns the mode)
  domeAngle: null,         // from the Roam-a-Dome's #DP reports, degrees from home
  // Saved settings by NVS key: BodyConfig.h's defaults until the S3 sends its own.
  settings: {
    hcr_vol_voc: 100, hcr_vol_a: 80, hcr_vol_b: 80, hcr_happy: 89, hcr_sad: 22, hcr_mad: 0, hcr_scared: 0,
    hcr_wav_conn: 21, hcr_wav_arm: 52, hcr_wav_disarm: 53, hcr_rand_first: 9, hcr_rand_last: 52,
    hcr_gap_ms: 5000, hcr_auto_on: 1, hcr_auto_min_s: 5, hcr_auto_max_s: 12,
    dome_spin_max: 100, dome_invert: 0, dome_auto_deg: 80, dome_auto_speed: 30,
    dome_auto_min_s: 6, dome_auto_max_s: 8,
    // Utility arm endpoints in microseconds, the firmware's defaults.
    arm_top_min: 1000, arm_top_close: 1150, arm_top_open: 1850, arm_top_max: 2000,
    arm_bot_min: 1000, arm_bot_close: 1150, arm_bot_open: 1850, arm_bot_max: 2000,
    px_count: 28, px_bright: 40,
    // Dome panel endpoints, from the dome Maestro's settings (tools/maestro/).
    ...Object.fromEntries([
      ["pie1", 992, 992, 2000, 2000], ["pie2", 992, 992, 2000, 2000],
      ["pie3", 608, 608, 2000, 2000], ["pie4", 608, 608, 2000, 2000],
      ["dome1", 608, 608, 2000, 2000], ["dome2", 608, 608, 2000, 2000],
      ["dome3", 608, 608, 2000, 2000], ["dome4", 608, 608, 2000, 2304],
      ["dome5", 992, 992, 2000, 2000], ["dome6", 608, 608, 1504, 1504],
      ["dome7", 608, 608, 1504, 1504],
    ].flatMap(([k, mn, cl, op, mx]) => [[`${k}_min`, mn], [`${k}_close`, cl], [`${k}_open`, op], [`${k}_max`, mx]])),
    // Holo servos, two per holo: x side to side, y up and down.
    ...Object.fromEntries(["f", "t", "r"].flatMap((h) => ["x", "y"].flatMap((a) =>
      [[`holo_${h}${a}_min`, 1000], [`holo_${h}${a}_mid`, 1500], [`holo_${h}${a}_max`, 2000]]))),
  },
};

const defaults = { ...droid.settings };  // what "Default" puts back

// Controls. Each edits one or more settings keys:
//   slider  one value               range   low and high (two thumbs)
//   toggle  on or off               number  a WAV file number
//   servo   min limit, closed, open, max limit (four thumbs)
// min/max/step are the slider's scale; the firmware's own limits still apply.
const secs = (x) => `${x} s`;
const pct = (x) => `${x}%`;
const S = (key, label, o) => ({ type: "slider", keys: [key], label, min: 0, max: 100, step: 1, show: pct, ...o });
const R = (lo, hi, label, o) => ({ type: "range", keys: [lo, hi], label, step: 1, ...o });
const T = (key, label) => ({ type: "toggle", keys: [key], label });
const N = (key, label) => ({ type: "number", keys: [key], label, min: 0, max: 9999, step: 1 });
const SV = (prefix, label) => ({ type: "servo", keys: ["min", "close", "open", "max"].map((p) => `${prefix}_${p}`),
  label, min: 500, max: 2500, step: 10, show: (x) => `${x} µs`, names: ["Min", "Closed", "Open", "Max"] });
//   axis    min limit, centre, max limit (three thumbs): a holo servo
const AX = (prefix, label) => ({ type: "axis", keys: ["min", "mid", "max"].map((p) => `${prefix}_${p}`),
  label, min: 500, max: 2500, step: 10, show: (x) => `${x} µs`, names: ["Min", "Centre", "Max"] });
const isMulti = (c) => c.type === "servo" || c.type === "axis";
const isLimit = (c, t) => isMulti(c) && (t === 0 || t === c.keys.length - 1);

// Setting groups, in the order shown, under their section heading. A group
// with no controls isn't built yet.
const v = (k) => droid.settings[k];
const settingGroups = [
  { section: "Sound", id: "volume", icon: "volume", name: "Volume",
    sum: () => `Voice ${v("hcr_vol_voc")}% · WAV A ${v("hcr_vol_a")}% · WAV B ${v("hcr_vol_b")}%`,
    note: "HCR saves each volume to its SD card, so a change is sent when you let go.",
    controls: [S("hcr_vol_voc", "Vocalizer voice"), S("hcr_vol_a", "WAV channel A (sound files)"),
               S("hcr_vol_b", "WAV channel B (unused for now)")] },
  { section: "Sound", id: "emotions", icon: "emotion", name: "Emotions",
    sum: () => ["happy", "sad", "mad", "scared"].map((e) =>
      `<img class="emo-sm" src="emoji/${e}.svg" alt="${e[0].toUpperCase() + e.slice(1)}" width="22" height="22">${v("hcr_" + e)}`).join(" · "),
    note: "How strongly each emotion colours the vocalizer's voice, 0–100.",
    controls: [S("hcr_happy", "Happy", { show: String, emo: "happy" }),
               S("hcr_sad", "Sad", { show: String, emo: "sad" }),
               S("hcr_mad", "Mad", { show: String, emo: "mad" }),
               S("hcr_scared", "Scared", { show: String, emo: "scared" })] },
  { section: "Sound", id: "sound-files", icon: "files", name: "Sound files",
    sum: () => `Connect ${v("hcr_wav_conn")} · Arm ${v("hcr_wav_arm")} · Disarm ${v("hcr_wav_disarm")} · Random ${v("hcr_rand_first")}–${v("hcr_rand_last")}`,
    controls: [N("hcr_wav_conn", "Connect"), N("hcr_wav_arm", "Arm"), N("hcr_wav_disarm", "Disarm"),
               R("hcr_rand_first", "hcr_rand_last", "Random sound files", { min: 1, max: 99, show: String }),
               S("hcr_gap_ms", "Gap between button sounds", { min: 0, max: 20000, step: 500, show: (x) => `${x / 1000} s` })] },
  { section: "Sound", id: "auto-sounds", icon: "auto", name: "Auto sounds",
    sum: () => v("hcr_auto_on") ? `On · every ${v("hcr_auto_min_s")}–${v("hcr_auto_max_s")} s in auto mode` : "Off · the dome wanders quietly",
    controls: [T("hcr_auto_on", "Sounds in auto mode"),
               R("hcr_auto_min_s", "hcr_auto_max_s", "Pause between sounds", { min: 1, max: 120, show: secs })] },
  { section: "Dome Control", id: "dome", icon: "dome", name: "Dome spin",
    sum: () => `Up to ${v("dome_spin_max")}% of the stick · ${v("dome_invert") ? "reversed" : "normal direction"}`,
    controls: [S("dome_spin_max", "Spin speed limit"), T("dome_invert", "Reverse direction")] },
  { section: "Dome Control", id: "dome-auto", icon: "domeauto", name: "Dome auto mode",
    sum: () => `±${v("dome_auto_deg")}° at ${v("dome_auto_speed")}% · every ${v("dome_auto_min_s")}–${v("dome_auto_max_s")} s`,
    controls: [S("dome_auto_deg", "Turn up to", { max: 180, show: (x) => `±${x}°` }), S("dome_auto_speed", "Speed"),
               R("dome_auto_min_s", "dome_auto_max_s", "Pause between moves", { min: 1, max: 120, show: secs })] },
  { section: "Servo Tuning", id: "arm-servos", icon: "servo", name: "Utility arms",
    sum: () => `Top ${v("arm_top_close")}–${v("arm_top_open")} µs · Bottom ${v("arm_bot_close")}–${v("arm_bot_open")} µs`,
    note: "Gold bars are the limits the servo can never pass. Closed and Open sit between them, either way round. Tap a point, then use − and + for 10 µs steps. The arm moves to each point as you change it, while the drive is disarmed.",
    controls: [SV("arm_top", "Top arm"), SV("arm_bot", "Bottom arm")] },
  { section: "Servo Tuning", id: "dome-servos", icon: "servo", name: "Dome panels",
    sum: () => "4 pie panels and 7 lower dome panels · Maestro channels 0–3 and 7–13",
    note: "The 11 panels on the dome Maestro, with the endpoints from its settings file as defaults. Gold bars are the limits, Closed and Open sit between them. Pie 5 joins this list when the lifter is built.",
    controls: [
      ...[1, 2, 3, 4].map((n) => SV(`pie${n}`, `Pie ${n} · channel ${n - 1}`)),
      ...[1, 2, 3, 4, 5, 6, 7].map((n) => SV(`dome${n}`, `Dome panel ${n} · channel ${n + 6}`)),
    ] },
  { section: "Servo Tuning", id: "holo-servos", icon: "holo", name: "Holoprojectors",
    sum: () => "Front, top and rear · two servos each",
    note: "Each holoprojector has two servos: side to side and up and down. Gold bars are the limits it can never pass; the teal point is where it rests. They're on the PCA9685 on the dome C3.",
    controls: [["f", "Front"], ["t", "Top"], ["r", "Rear"]].flatMap(([h, n]) =>
      [AX(`holo_${h}x`, `${n} holo · side to side`), AX(`holo_${h}y`, `${n} holo · up and down`)]) },
  { section: "Animations", id: "animations", icon: "pie", name: "Animations and servo sequences",
    sum: () => `${animList.length} animations · ${seqOrder().length} servo sequences`,
    custom: renderAnimSettings },
  { section: "Lights", id: "lights", icon: "lights", name: "Body lights",
    sum: () => `${v("px_count")} pixels · ${v("px_bright")}% brightness`,
    note: "The NeoPixel strip on the body C3. Brightness scales every effect; 40% keeps 28 pixels at full white under about 0.7 A. Effects are set in animations, with a Lights item.",
    controls: [S("px_count", "Strip length (pixels)", { min: 1, max: 64, show: String }), S("px_bright", "Overall brightness", { min: 5, max: 100 })] },
  { section: "Network", id: "wifi", icon: "wifi", name: "Wi-Fi",
    sum: () => `“${esc(droid.wifi.name)}” · ${droid.wifi.custom ? "name and password set here" : "built-in name and password"}`,
    custom: renderWifi },
  { section: "Radio & Drive", id: "radio", icon: "radio", name: "Radio calibration", sum: () => "Not built yet: record channel values from a live view" },
  { section: "Radio & Drive", id: "drive", icon: "drive", name: "Drive tuning", sum: () => "Not built yet: ramps, speed levels and expo" },
];

const icons = {
  // the droid: dome, body as wide as the dome, shoulders and leg tops
  control: '<path d="M12 4a6 6 0 0 0-6 6v2h12v-2a6 6 0 0 0-6-6z"/><path d="M6 12v9.5M18 12v9.5"/><path d="M1.4 21.5V13.2q0-1.6 1.6-1.6h.6q1.6 0 1.6 1.6V21.5M18.8 21.5V13.2q0-1.6 1.6-1.6h.6q1.6 0 1.6 1.6V21.5"/><circle cx="10.6" cy="8.4" r="1.4"/><path d="M9 16h6M9 19h6"/>',
  settings: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  backup: '<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M12 12v5M9.5 14.5L12 17l2.5-2.5"/>',
  firmware: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/><path d="M12 14.5v-5M10 11.5l2-2 2 2"/>',
  volume: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  emotion: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/>',
  files: '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  auto: '<path d="M3 12h3l2-5 3 10 3-8 2 3h5"/>',
  dome: '<path d="M5 15a7 7 0 0 1 14 0z"/><path d="M3 18.5h18"/><path d="M9 4.5A8 8 0 0 0 4.5 8M15 4.5A8 8 0 0 1 19.5 8"/><path d="M19.5 5v3h-3"/>',
  domeauto: '<path d="M5 14a7 7 0 0 1 14 0z"/><path d="M3 17.5h18"/><path d="M12 7v-3M12 7l2.5 2"/>',
  radio: '<rect x="4" y="9" width="16" height="11" rx="2.5"/><circle cx="9" cy="14.5" r="2"/><circle cx="15" cy="14.5" r="2"/><path d="M8 9V4M16 9V6"/>',
  drive: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M4.2 16.5l5.6-3.2M19.8 16.5l-5.6-3.2"/>',
  servo: '<rect x="4" y="8" width="16" height="10" rx="2"/><circle cx="9" cy="8" r="3"/><path d="M9 8l6-5"/><path d="M2 11h2M2 15h2M20 11h2M20 15h2"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  lights: '<rect x="2" y="10" width="20" height="5" rx="2.5"/><path d="M6 12.5h.01M10 12.5h.01M14 12.5h.01M18 12.5h.01" stroke-width="2.6"/><path d="M6 7V5M12 7V4M18 7V5"/>',
  wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/>',
  logic: '<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 10.5h.01M10.3 10.5h.01M13.6 10.5h.01M17 10.5h.01M7 13.5h.01M10.3 13.5h.01M13.6 13.5h.01M17 13.5h.01" stroke-width="2.4"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/>',
  beep: '<path d="M4 5h16v11H10l-4 3.5V16H4z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01" stroke-width="2.6"/>',
  note: '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  arrowL: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  arrowU: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  turn: '<path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  pie: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 2.5a8 8 0 0 1 6.5 6.5H15z"/>',
  holo: '<circle cx="9" cy="12" r="4.5"/><circle cx="9" cy="12" r="1.6"/><path d="M13.5 9.5L21 6M13.5 14.5L21 18M21 6v12"/>',
};
const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;

// Settings, backup and updates lock while armed; updates also need the enable
// switch off. Returns why, or "".
function lockReason(id) {
  if (!["droid-settings", "backup", "firmware"].includes(id) && !id.startsWith("set-") && !id.startsWith("anim-") && !id.startsWith("seq-")) return "";
  if (droid.armed) return "Disarm the drive first";
  if (id === "firmware" && droid.enableSwitch) return "Turn the enable switch off first";
  return "";
}

const screens = {
  "menu": { title: "R2-AU", render: renderMenu },
  "droid-control": { title: "Droid Control", render: renderControl },
  "droid-settings": { title: "Settings", render: renderSettings },
  "backup": { title: "Backup / Restore", render: renderBackup, wifiOnly: true },
  "firmware": { title: "Firmware Update", render: renderFirmware, wifiOnly: true },
};
// One detail screen per setting group: #set-volume, #set-dome, ...
for (const g of settingGroups) {
  screens["set-" + g.id] = { title: g.name, render: () => renderSettingGroup(g), parent: "droid-settings" };
}

function renderMenu() {
  const onDisplay = droid.client === "display";
  const tile = (id, icon, name, sub) => {
    const wifiOnly = screens[id].wifiOnly;
    const lock = lockReason(id);
    let tag = wifiOnly ? "Wi-Fi only" : "", tagClass = "", disabled = false;
    if (wifiOnly && onDisplay) { sub = "Open the web page on Wi-Fi to use this"; disabled = true; }
    else if (lock) { sub = lock; tag = "Locked"; tagClass = "lock"; disabled = true; }
    return `
    <button class="tile${lock && !(wifiOnly && onDisplay) ? " locked" : ""}" data-go="${id}" ${disabled ? "disabled" : ""}>
      <span class="ico">${svg(icon)}</span>
      <strong>${name}</strong><span class="sub">${sub}</span>
      ${tag ? `<span class="tag ${tagClass}">${tag}</span>` : ""}
    </button>`;
  };
  return `<div class="menu">
    ${tile("droid-control", "control", "Droid Control", "Sounds, dome moves and sequences")}
    ${tile("droid-settings", "settings", "Settings", "Volume, dome, auto mode, radio and servos")}
    ${tile("backup", "backup", "Backup / Restore", "Save or load sequences and settings")}
    ${tile("firmware", "firmware", "Firmware Update", "Update the S3 and both C3s")}
  </div>`;
}

// Droid Control. Every tile is a one-off action: the radio stays in charge,
// so nothing here arms the drive, moves the feet, or changes the CH5 dome mode.
let controlTab = "sounds";
try { controlTab = localStorage.getItem("r2au-control-tab") || "sounds"; } catch (e) {}

// Sound tiles.
const wav = (name, file) => ({ name, sub: String(file).padStart(4, "0"), act: { kind: "wav", file } });
const rnd = (name, a, b) => ({ name, sub: `${String(a).padStart(4, "0")}–${String(b).padStart(4, "0")}`, act: { kind: "random", a, b } });
const im = (t, img) => ({ ...t, img });
const soundSections = [
  ["Random", [im(rnd("Happy chatter", 13, 17), "sfx-happy"), im(rnd("Whistles and woos", 17, 25), "sfx-whistles"),
              im(rnd("Random set 3", 25, 32), "sfx-dice3"), im(rnd("Random set 4", 32, 52), "sfx-dice4"),
              im(rnd("Anything", 9, 52), "sfx-anything")]],
  ["Sounds", [im(wav("Alarm", 1), "sfx-alarm"), im(wav("Chuckle and fart", 2), "sfx-chuckle"),
              im(wav("Doot doot and whistle", 3), "sfx-doot"), im(wav("Wolf whistle", 4), "sfx-wolf"),
              im(wav("System failure", 6), "sfx-failure"), im(wav("Beep beep boop boop", 7), "sfx-beep"),
              im(wav("Whistle beep wooo", 8), "sfx-woo")]],
  ["Music", [im(wav("Star Wars theme", 9), "music-theme"), im(wav("Cantina", 10), "music-cantina"),
             im(wav("Imperial March", 11), "music-march"), im(wav("Duel of the Fates", 12), "music-duel")]],
  ["Messages", [im(wav("Leia message", 5), "sfx-message")]],
];
// Animations (ids 200+): a sound plus what plays with it, as timed steps
// (Animations.h). These are the S3's defaults, for the preview; connected,
// the page shows the droid's own library.
const K = { Sound: 1, RandomSound: 2, Emotion: 3, ServoSequence: 4, Holo: 5, Logic: 6, SoundPick: 7, Dome: 8, Pixels: 9 };
// Servo sequence names by number; replaced by the droid's list when connected.
let seqNames = ["All Closed", "All Open", "Cantina", "Clap", "Pie 1 Open", "Pie 2 Open", "Pie 3 Open",
  "Pie 4 Open", "Point", "Ripple", "Wave",
  // Utility arms (body C3), numbered after the dome's (ArmSequenceData.cpp).
  "Top Arm Open", "Top Arm Close", "Bottom Arm Open", "Bottom Arm Close", "Arms Open and Close", "Arms Flap"];
let seqLengths = { "All Closed": 0.5, "All Open": 0.5, "Cantina": 9.7, "Clap": 1.35, "Wave": 2.9, "Ripple": 0.8,
  "Point": 0.6, "Pie 1 Open": 0.5, "Pie 2 Open": 0.5, "Pie 3 Open": 0.5, "Pie 4 Open": 0.5,
  "Top Arm Open": 0.6, "Top Arm Close": 0.6, "Bottom Arm Open": 0.6, "Bottom Arm Close": 0.6,
  "Arms Open and Close": 2.1, "Arms Flap": 5.6 };
function defaultAnimList() {
  const R5 = "~RTLE990505";  // logic random pattern, 5 s
  const snd = (f) => ({ atMs: 0, kind: K.Sound, a: f, b: 0, text: "" });
  const rnd = (x, y) => ({ atMs: 0, kind: K.RandomSound, a: x, b: y, text: "" });
  // name, icon, sound, servo sequence, holo, logic, [second holo, at ms]
  const defs = [
    ["Happy chatter", "sfx-happy", rnd(13, 17), null, "A0033|5", R5],
    ["Whistles and woos", "sfx-whistles", rnd(17, 25), null, "S5", R5],
    ["Random set 3", "sfx-dice3", rnd(25, 32), null, "S5", R5],
    ["Random set 4", "sfx-dice4", rnd(32, 52), null, "S5", R5],
    ["Alarm", "sfx-alarm", snd(1), null, null, "0T3"],
    ["Chuckle and fart", "sfx-chuckle", snd(2), null, "F0028|4", R5],
    ["Doot doot and whistle", "sfx-doot", snd(3), "Wave", null, R5],
    ["Wolf whistle", "sfx-wolf", snd(4), "Point", "A0034|5", "~RTLE66505"],
    ["System failure", "sfx-failure", snd(6), "All Open", "A007", "0T4"],
    ["Beep beep boop boop", "sfx-beep", snd(7), null, null, R5],
    ["Whistle beep wooo", "sfx-woo", snd(8), null, null, R5],
    ["Star Wars theme", "music-theme", snd(9), null, null, R5],
    ["Cantina", "music-cantina", snd(10), "Cantina", "A006|60", "~RTLE100560"],
    ["Imperial March", "music-march", snd(11), null, "S4", "0T11", "A0051|30", 100],
    ["Duel of the Fates", "music-duel", snd(12), null, "A0027|15", "~RTLE69530"],
    ["Leia message", "sfx-message", snd(5), null, "S1", "~RTLE30000", "S5", 34000],
  ];
  return defs.map(([name, icon, sound, servo, holo, logic, holo2, at2], i) => {
    const steps = [sound];
    if (servo) steps.push({ atMs: 0, kind: K.ServoSequence, a: seqNames.indexOf(servo), b: 0, text: "" });
    if (holo) steps.push({ atMs: 0, kind: K.Holo, a: 0, b: 0, text: holo });
    if (holo2) steps.push({ atMs: at2, kind: K.Holo, a: 0, b: 0, text: holo2 });
    if (logic) steps.push({ atMs: 0, kind: K.Logic, a: 0, b: 0, text: logic });
    return { id: 200 + i, name, icon, steps };
  }).concat([{
    // Chortle No: a chortle and a shake of the head. Dome steps:
    // a = action | speed << 8 (1 = face an angle, 0 = look ahead), b = angle.
    id: 216, name: "Chortle No", icon: "sfx-chuckle", steps: [
      snd(2),
      { atMs: 0, kind: K.Dome, a: 1 | (60 << 8), b: -30, text: "" },
      { atMs: 1000, kind: K.Dome, a: 1 | (60 << 8), b: 30, text: "" },
      { atMs: 2000, kind: K.Dome, a: 0, b: 0, text: "" },
    ] }]);
}
let animList = defaultAnimList();
const animByName = (n) => animList.find((a) => a.name === n);
const firstStep = (a, kind) => a.steps.find((s) => s.kind === kind);
function partsOf(a) {
  const q = firstStep(a, K.ServoSequence), h = firstStep(a, K.Holo), l = firstStep(a, K.Logic);
  return { servo: q ? seqNames[q.a] : undefined, holo: h ? h.text : undefined, logic: l ? l.text : undefined };
}

// Plain-English names for holo (Flthy) and logic (Logic Engine) commands.
const HOLO_COLOURS = ["random", "red", "yellow", "green", "cyan", "blue", "magenta", "orange", "purple", "white"];
// Several commands (one per HP) read as a list.
const holoLabel = (t) => (t || "").trim().split(/\s+/).filter(Boolean).map(holoLabelOne).join(" · ");
function holoLabelOne(t) {
  if (!t) return "";
  const seq = { S1: "Leia mode", S4: "all off", S5: "normal show", S7: "all off", S8: "normal show", S9: "normal show" };
  if (seq[t]) return seq[t];
  const m = /^([FTRAXYZ])([01])(\d\d)(\d?)(\d?)(?:\|(\d+))?$/.exec(t);
  if (!m) return t;
  const who = { F: "front", T: "top", R: "rear", A: "all", X: "front and rear", Y: "front and top", Z: "rear and top" }[m[1]];
  const led = { "01": "Leia", "02": "projector", "03": "pulse", "04": "cycle", "05": "solid", "06": "rainbow", "07": "short circuit", "96": "off", "98": "off", "97": "auto", "99": "auto" };
  const servo = { "01": "move", "04": "random position", "05": "wag side to side", "06": "wag up and down", "98": "twitch off", "99": "twitch on" };
  const what = (m[2] === "0" ? led : servo)[m[3]] || `effect ${m[3]}`;
  const colour = m[2] === "0" && m[4] !== "" ? `, ${HOLO_COLOURS[+m[4]]}` : "";
  return `${who === "all" ? "" : who + " "}${what}${colour}${m[6] ? `, ${m[6]} s` : ""}`.replace(/^./, (c) => c.toUpperCase());
}
const LOGIC_COLOURS = ["default", "red", "orange", "yellow", "green", "cyan", "blue", "purple", "magenta", "pink"];
const LOGIC_EFFECTS = { 0: "normal", 1: "alarm", 2: "failure", 3: "Leia", 4: "march", 5: "solid colour", 6: "flash colour",
  7: "flip flop", 8: "flip flop alt", 9: "colour swap", 10: "rainbow", 11: "red alert", 12: "mic bright", 13: "mic rainbow",
  14: "lights out", 15: "text", 16: "text scroll left", 17: "text scroll right", 18: "text scroll up", 99: "random" };
const LOGIC_DISPLAY_NAMES = { 0: "", 1: "front logics", 3: "rear logic", 4: "front PSI", 5: "rear PSI" };
function logicLabelOne(t) {
  const jawa = { "0T3": "Alarm", "0T4": "Failure", "0T5": "Red alert", "0T11": "March" };
  if (jawa[t]) return jawa[t];
  const m = /^~RTLE(\d+)$/.exec(t);
  if (!m) return t;
  const all = +m[1], v = all % 1000000;
  const effect = Math.floor(v / 10000), colour = Math.floor(v / 1000) % 10, secs = v % 100;
  const name = LOGIC_EFFECTS[effect] || `effect ${effect}`;
  return `${name[0].toUpperCase()}${name.slice(1)}${colour ? `, ${LOGIC_COLOURS[colour]}` : ""}${secs ? `, ${secs} s` : ""}`;
}
// One effect on some displays reads as "Solid colour, red: front PSI, rear PSI".
function logicLabel(t) {
  if (!t) return "";
  const parts = t.split(";").map((x) => x.trim()).filter(Boolean);
  const disp = parts.map((p) => { const m = /^~RTLE(\d+)$/.exec(p); return m ? Math.floor(+m[1] / 1000000) : -1; });
  const labels = parts.map(logicLabelOne);
  if (labels.every((x) => x === labels[0]) && disp.every((d) => d >= 0)) {
    const where = disp.includes(0) ? "" : disp.map((d) => LOGIC_DISPLAY_NAMES[d] || `display ${d}`).join(", ");
    return where ? `${labels[0]}: ${where}` : labels[0];
  }
  return labels.join(" · ");
}

const emotionTiles = [
  { emo: "happy", name: "Happy", sub: "Moderate" }, { emo: "sad", name: "Sad", sub: "Moderate" },
  { emo: "mad", name: "Mad", sub: "Moderate" }, { emo: "scared", name: "Scared", sub: "Moderate" },
  { emo: "neutral", name: "Surprise me", sub: "Random emotion" },
];
// Servo sequences: the dome panels' (ported from the Maestro, tools/maestro/),
// then the utility arms'. Shown in this order; any the droid has beyond these
// come after.
const SEQ_ORDER = ["All Open", "All Closed", "Cantina", "Clap", "Wave", "Ripple", "Point", "Pie 1 Open", "Pie 2 Open",
  "Pie 3 Open", "Pie 4 Open", "Arms Open and Close", "Arms Flap", "Top Arm Open", "Top Arm Close", "Bottom Arm Open",
  "Bottom Arm Close"];
const seqOrder = () => [...SEQ_ORDER.filter((n) => seqNames.includes(n)), ...seqNames.filter((n) => !SEQ_ORDER.includes(n))];
const domeMoves = [
  { name: "Look ahead", sub: "home", act: { kind: "dome-home" }, icon: "arrowU" },
  { name: "Look left", sub: "−90°", act: { kind: "dome-goto", deg: -90 }, icon: "arrowL" },
  { name: "Look right", sub: "+90°", act: { kind: "dome-goto", deg: 90 }, icon: "arrowR" },
  { name: "Look behind", sub: "180°", act: { kind: "dome-goto", deg: 180 }, icon: "turn" },
  { name: "Stop", sub: "cancel the move", act: { kind: "dome-stop" }, stop: true },
];

// Actions are kept in a table the tiles point at by index.
let actions = [];
const tile = (t) => {
  actions.push(t);
  const hue = t.stop ? "red" : t.hue || "teal";
  const ico = t.stop ? "stop" : t.icon || "beep";
  const face = t.img ? `<span class="pico pimg"><img src="emoji/${t.img}.svg" alt="" width="44" height="44"></span>` : `<span class="pico">${svg(ico)}</span>`;
  const an = t.anim ? partsOf(t.anim) : null;
  const parts = an ? `<span class="parts" aria-label="Also moves: ${[an.servo && "servos", an.holo && "holoprojectors", an.logic && "logic displays"].filter(Boolean).join(", ")}">
      ${an.servo ? `<span title="Servos: ${esc(an.servo)}">${svg("pie")}</span>` : ""}${an.holo ? `<span title="Holoprojectors: ${holoLabel(an.holo)}">${svg("holo")}</span>` : ""}${an.logic ? `<span title="Logic displays: ${logicLabel(an.logic)}">${svg("logic")}</span>` : ""}</span>` : "";
  return `<button class="ptile hue-${hue}" data-act="${actions.length - 1}">${face}
    <b>${esc(t.name)}</b>${t.noSub ? parts : `<small>${t.sub}</small>`}</button>`;
};

function renderControl() {
  actions = [];
  const tabs = [["sounds", "Sounds"], ["emotions", "Emotions"], ["dome", "Dome"], ["sequences", "Servo Sequences"]];
  const bar = `<div class="tabs" role="tablist">${tabs.map(([id, n]) =>
    `<button role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${id === controlTab}" tabindex="${id === controlTab ? 0 : -1}">${n}</button>`).join("")}
    <span class="hint-r">Works while driving</span></div>`;
  let body = "";
  if (controlTab === "sounds") {
    // One grid, no headings: the groups are only for keeping this list in order.
    const look = { Random: ["teal", "dice"], Sounds: ["gold", "beep"], Music: ["violet", "note"], Messages: ["sky", "holo"] };
    const named = new Set(soundSections.flatMap(([, items]) => items.map((t) => t.name)));
    body = `<div class="tiles">${soundSections.flatMap(([sec, items]) => items.map((t) =>
      tile({ ...t, noSub: true, hue: look[sec][0], icon: look[sec][1], anim: animByName(t.name) }))).join("")}
      ${animList.filter((a) => !named.has(a.name)).map((a) =>
        tile({ name: esc(a.name), noSub: true, hue: "sky", icon: "pie", img: a.icon || null, anim: a, act: { kind: "anim" } })).join("")}</div>`;
  } else if (controlTab === "emotions") {
    body = `<div class="etiles">${emotionTiles.map((t) => {
      actions.push({ name: t.name, act: { kind: "emotion", emo: t.emo } });
      return `<button class="etile" data-act="${actions.length - 1}"${t.emo !== "neutral" ? ` data-emo="${t.emo}"` : ""}>
        <img src="emoji/${t.emo}.svg" alt="" width="76" height="76"><b>${t.name}</b><small>${t.sub}</small></button>`;
    }).join("")}</div>`;
  } else if (controlTab === "dome") {
    const mode = { manual: "Manual: the left stick spins the dome", auto: "Auto: the dome wanders on its own", home: "Home" }[droid.domeMode];
    body = `<div class="panel-note"><span><b>Radio CH5:</b> ${mode}. The switch on the radio sets the mode; these buttons are one-off moves.</span>
      <span>After power-up the Roam-a-Dome ignores these until the dome has been turned once with the stick.</span></div>
      <div class="dome-row">${domeMoves.map(tile).join("")}</div>`;
  } else {
    body = `<div class="tiles">${seqOrder().map((n) => tile({ name: n, sub: `${seqLengths[n]} s`, act: { kind: "sequence", name: n }, hue: "gold", icon: "pie" })).join("")}
      ${tile({ name: "Stop and close", sub: "stops any sequence, closes panels and arms", act: { kind: "sequence-stop" }, stop: true })}</div>`;
  }
  return bar + body;
}

let toastTimer;
// Short messages; they stay up long enough to read (longer for longer text).
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), Math.max(2500, text.length * 70));
}
// Tells screen readers about a change that has no message of its own.
function announce(text) {
  const el = document.getElementById("sr");
  el.textContent = "";
  setTimeout(() => { el.textContent = text; }, 60);
}
// Scrolling animates only when the viewer hasn't asked for reduced motion.
const motion = () => (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");

// Sends one action to the droid, or in the preview says what would happen.
const EMOTIONS = { happy: 0, sad: 1, mad: 2, scared: 3, neutral: 4 };
function sendAction(t, el) {
  el.classList.add("sent");
  setTimeout(() => el.classList.remove("sent"), 500);
  const a = t.act;
  if (live.ws) {
    if (t.anim) live.send(new W().u8(UI.RunAnimation).u16(t.anim.id));
    else if (a.kind === "wav") live.send(new W().u8(UI.PlaySound).u16(a.file));
    else if (a.kind === "random") live.send(new W().u8(UI.PlayRandom).u16(a.a).u16(a.b));
    else if (a.kind === "emotion") live.send(new W().u8(UI.Emotion).u8(EMOTIONS[a.emo]));
    else if (a.kind === "dome-home") live.send(new W().u8(UI.DomeHome));
    else if (a.kind === "dome-goto") live.send(new W().u8(UI.DomeGoTo).i16(a.deg));
    else if (a.kind === "dome-stop") live.send(new W().u8(UI.DomeStop));
    else if (a.kind === "sequence") live.send(new W().u8(UI.RunServoSequence).u8(seqNames.indexOf(a.name)));
    else if (a.kind === "sequence-stop") live.send(new W().u8(UI.StopAll));
  }
  const an = t.anim ? partsOf(t.anim) : null;
  const extra = an ? " with " + [an.servo && `${an.servo} panels`, an.holo && "holos", an.logic && "logics"].filter(Boolean).join(", ").replace(/, ([^,]*)$/, " and $1") : "";
  const what = { wav: () => `Playing ${t.name}${extra}`, random: () => `Playing ${t.name}${extra}`,
    emotion: () => `Feeling ${t.name.toLowerCase()}`, "dome-home": () => "Dome going home",
    "dome-goto": () => `Dome turning to ${t.sub}`, "dome-stop": () => "Dome stopped",
    sequence: () => `Running ${t.name}`, anim: () => `Playing ${t.name}`, "sequence-stop": () => "Stopping and closing panels and arms" }[a.kind]();
  toast(droid.connected ? what : `${what} (preview)`);
}

function renderSettings() {
  let lastSection = "";
  const rows = settingGroups.map((g) => {
    const built = !!(g.controls || g.custom);
    const head = g.section !== lastSection ? `<h2 class="section">${g.section}</h2>` : "";
    lastSection = g.section;
    return `${head}<button class="tile row" data-go="set-${g.id}" ${built ? "" : "disabled"}>
      <span class="ico">${svg(g.icon)}</span>
      <strong>${g.name}</strong><span class="sub">${g.sum()}</span>
      ${built ? "" : `<span class="tag">Later</span>`}
      ${built ? `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons.chev}</svg>` : "<span></span>"}
    </button>`;
  }).join("");
  return `<p class="lead">Saved on the droid, so the web page and the display show the same values.</p>
    <div class="rows">${rows}</div>`;
}

// The group whose controls are on screen; slider events look controls up here.
let openGroup = null;

function renderSettingGroup(g) {
  openGroup = g;
  if (g.custom) return g.custom();
  const cards = g.controls.map((c, i) => `<div class="ctl" data-ctl="${i}"${c.emo ? ` data-emo="${c.emo}"` : ""}>${controlHtml(c, i)}</div>`).join("");
  return `${g.note ? `<p class="lead">${g.note}</p>` : `<p class="lead">Changes save on the droid when you let go.</p>`}
    <div class="ctls">${cards}</div>`;
}

const vals = (c) => c.keys.map((k) => droid.settings[k]);
const isDefault = (c) => c.keys.every((k) => droid.settings[k] === defaults[k]);
const pos = (c, x) => ((x - c.min) / (c.max - c.min)) * 100;

function valueText(c) {
  const x = vals(c);
  if (c.type === "toggle") return x[0] ? "On" : "Off";
  if (c.type === "range") return `${c.show(x[0])} – ${c.show(x[1])}`;
  if (c.type === "servo") return `${x[1]} → ${x[2]} µs`;
  if (c.type === "axis") return `centre ${x[1]} µs`;
  if (c.type === "number") return "";
  return c.show(x[0]);
}

function controlHtml(c, i) {
  const head = (extra = "") => `<div class="ctl-head"><b>${c.emo ? `<img class="emo" id="emo-${i}" src="emoji/${c.emo}.svg" alt="" width="34" height="34">` : ""}${c.label}</b><span class="right">
    <span class="saved" id="saved-${i}">Saved</span><span class="val" id="val-${i}">${valueText(c)}</span>${extra}</span></div>`;
  const reset = `<button class="link" data-reset="${i}" ${isDefault(c) ? "hidden" : ""}>Default</button>`;
  if (c.type === "toggle") {
    return head(`<button class="switch" role="switch" aria-label="${c.label}" aria-checked="${!!vals(c)[0]}" data-toggle="${i}"></button>`);
  }
  if (c.type === "number") {
    return head(`<span class="stepper"><button class="step" data-nudge="${i}" data-d="-1" aria-label="${c.label} down">−</button>
      <input class="num" id="num-${i}" type="number" inputmode="numeric" min="${c.min}" max="${c.max}" value="${vals(c)[0]}" data-num="${i}" aria-label="${c.label} file number">
      <button class="step" data-nudge="${i}" data-d="1" aria-label="${c.label} up">+</button></span>`) +
      `<div class="ctl-foot"><span class="hint">${c.keys[0]} · file ${c.min}–${c.max}</span>${reset}</div>`;
  }
  const n = c.keys.length;
  if (c.sel === undefined) c.sel = isMulti(c) ? 1 : 0;
  const thumbs = vals(c).map((x, t) => {
    const limit = isLimit(c, t);
    const label = isMulti(c) ? c.names[t] : c.type === "range" ? ["Low", "High"][t] : c.label;
    const glyph = c.type === "servo" && !limit ? c.names[t][0] : "";
