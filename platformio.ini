; Firmware for all three nodes. Pinned to espressif32 6.9.0 (Arduino core
; 2.0.17): the LEDC and watchdog calls use the 2.0.x API.

[platformio]
default_envs = body_s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_echo = yes
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
; Stamps the version into every build and copies each image to dist/.
extra_scripts = pre:tools/version.py

; ---------------------------------------------------------------------------
; Body: ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
; Console on the native USB port, so all three UARTs stay free.
; ---------------------------------------------------------------------------
[env:body_s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DDROID_NODE_BODY=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
build_src_filter = +<body/>
extra_scripts =
    pre:tools/version.py
    pre:tools/make_secrets.py
    pre:tools/embed_web.py

; ---------------------------------------------------------------------------
; Dome: ESP32-C3 mini (Super Mini style boards)
; Console on the built-in USB, so UART0 and UART1 stay free.
; ---------------------------------------------------------------------------
[env:dome_c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DDROID_NODE_DOME=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<dome/>
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3

; ---------------------------------------------------------------------------
; Body accessories: ESP32-C3 mini behind the utility arm panel
; ---------------------------------------------------------------------------
[env:body_c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DDROID_NODE_BODY_C3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<bodyc3/>
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
